<!DOCTYPE html><html lang="zh-CN"><head><meta charset="UTF-8"><title>角色管理</title>
<style>/* 使用系统字体 */
*{margin:0;padding:0;box-sizing:border-box}body{font-family:-apple-system,BlinkMacSystemFont,'PingFang SC','Microsoft YaHei',sans-serif;background:#F7FAFC;padding:0}
:root{--blue-primary:#3B82F6;--border:#E2E8F0;--text:#1A202C;--hint:#A0AEC0;--radius:8px;--white:#fff}
.page-header{display:flex;justify-content:space-between;align-items:center;margin-bottom:20px}
.page-header h2{font-size:20px;font-weight:700}
.btn{padding:8px 18px;border:none;border-radius:var(--radius);font-size:13px;cursor:pointer}
.btn-primary{background:var(--blue-primary);color:white}
.card{background:white;border-radius:10px;padding:20px;border:1px solid var(--border)}
table{width:100%;border-collapse:collapse}
th{background:#F7FAFC;padding:12px 16px;text-align:left;font-size:12px;color:var(--hint);border-bottom:1px solid var(--border)}
td{padding:12px 16px;font-size:13px;border-bottom:1px solid var(--border)}</style></head>
<body>
<div class="page-header"><h2>角色管理</h2><button class="btn btn-primary" onclick="window.open('/admin/auth/group/add/','_blank')">+ 新增角色</button></div>
<p style="color:var(--hint);margin-bottom:16px">角色管理通过 Django 后台操作，点击上方按钮进入</p>
<div class="card">
<table><thead><tr><th>角色名</th><th>描述</th><th>权限</th></tr></thead>
<tbody><tr><td>专业负责人</td><td>管理能力图谱</td><td>产业链管理、岗位编辑、爬取数据、生成图谱</td></tr>
<tr><td>系统管理员</td><td>系统管理</td><td>全部权限</td></tr></tbody></table>
</div></body></html>
