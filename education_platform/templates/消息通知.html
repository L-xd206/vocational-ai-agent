<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>消息通知</title>
  <style>
    @import url('https://fonts.googleapis.com/css2?family=Noto+Sans+SC:wght@300;400;500;600;700;800&display=swap');
    * { margin:0; padding:0; box-sizing:border-box; }
    :root { --blue:#3B82F6; --ink:#172033; --muted:#7E8DA8; --line:#E3EBF5; --white:#FFFFFF; --shadow:0 14px 34px rgba(29,45,74,.08); }
    body { height:100vh; overflow:hidden; display:flex; flex-direction:column; padding:14px 20px 10px; background:radial-gradient(circle at 8% 8%,rgba(191,219,254,.5),transparent 28%),radial-gradient(circle at 92% 12%,rgba(165,180,252,.45),transparent 26%),#F7FAFC; color:var(--ink); font-family:'Noto Sans SC','Microsoft YaHei',sans-serif; }
    .page-head { display:flex; align-items:center; gap:14px; flex-wrap:wrap; padding:14px 16px; margin-bottom:12px; border:1px solid var(--line); border-radius:16px; background:rgba(255,255,255,.92); box-shadow:0 10px 26px rgba(29,45,74,.06); }
    .page-title { font-size:20px; font-weight:800; color:#1F2D44; }
    .page-sub { font-size:13px; color:var(--muted); font-weight:600; }
    .head-actions { display:flex; gap:10px; margin-left:auto; }
    .btn { height:36px; display:inline-flex; align-items:center; justify-content:center; gap:7px; padding:0 15px; border:1px solid #DDE8F4; border-radius:11px; background:var(--white); color:#43516A; font-size:13px; font-weight:700; font-family:inherit; cursor:pointer; transition:.18s ease; box-shadow:0 5px 16px rgba(33,51,84,.05); }
    .btn:hover { transform:translateY(-1px); border-color:#B8C8DF; }
    .btn-primary { border-color:#3B82F6; background:linear-gradient(135deg,#60A5FA,#2563EB); color:#fff; box-shadow:0 10px 22px rgba(37,99,235,.22); }
    .msg-list { flex:1; min-height:0; overflow-y:auto; display:flex; flex-direction:column; gap:10px; }
    .msg-card { position:relative; padding:16px 18px 14px 22px; border:1px solid var(--line); border-radius:14px; background:var(--white); box-shadow:var(--shadow); cursor:pointer; transition:.16s ease; }
    .msg-card:hover { transform:translateY(-1px); border-color:#C7D8EE; }
    .msg-card.read { opacity:.72; }
    .msg-card .dot { position:absolute; left:10px; top:20px; width:8px; height:8px; border-radius:50%; background:#3B82F6; box-shadow:0 0 0 3px rgba(59,130,246,.15); }
    .msg-top { display:flex; align-items:center; justify-content:space-between; gap:12px; margin-bottom:6px; }
    .msg-title { font-size:14px; font-weight:800; color:#1F2D44; }
    .msg-time { font-size:12px; color:var(--muted); font-weight:600; flex-shrink:0; }
    .msg-body { font-size:13px; color:#4A5A74; line-height:1.6; margin-bottom:8px; }
    .msg-tag { display:inline-flex; align-items:center; padding:2px 9px; border-radius:7px; font-size:11px; font-weight:800; background:#EEF4FE; color:#3B82F6; }
    .empty-tip { padding:60px 0; text-align:center; color:var(--muted); font-size:14px; }
    .pagination { display:flex; align-items:center; justify-content:center; gap:6px; padding:10px; }
    .page-btn { min-width:30px; height:30px; border:1px solid #DDE8F4; border-radius:9px; background:#fff; color:#5C6C84; cursor:pointer; font-family:inherit; font-weight:800; } .page-btn.active { border-color:#3B82F6; background:#3B82F6; color:#fff; }
    .toast { position:fixed; right:22px; top:22px; z-index:120; padding:12px 18px; border-radius:12px; background:#172033; color:#fff; font-size:13px; font-weight:700; opacity:0; transform:translateY(-12px); transition:.25s ease; pointer-events:none; } .toast.show { opacity:1; transform:translateY(0); }
  </style>
</head>
<body>
  {% csrf_token %}
  <section class="page-head">
    <div class="page-title">消息通知</div>
    <div class="page-sub">岗位数据、课程调整与系统公告</div>
    <div class="head-actions">
      <button class="btn" onclick="markAllRead()">全部已读</button>
      <button class="btn btn-primary" onclick="loadMessages()">刷新</button>
    </div>
  </section>

  <div class="msg-list" id="msgList"><div class="empty-tip">加载中...</div></div>

  <div class="pagination" id="paginationBtns"></div>

  <div class="toast" id="toast"></div>

  <script>
    function getCookie(n){if(document.cookie){for(const c of document.cookie.split(';')){const t=c.trim();if(t.startsWith(n+'='))return decodeURIComponent(t.substring(n.length+1))}}return null}
    const csrftoken = getCookie('csrftoken');
    const jsonHeaders = () => { const h={'Content-Type':'application/json'}; if(csrftoken) h['X-CSRFToken']=csrftoken; return h; };

    let messages = [], total = 0, currentPage = 1, pageSize = 10;

    function notifyParentBadge() {
      try { window.parent && window.parent.postMessage({ type: 'msg-badge-refresh' }, '*'); } catch(e) {}
    }

    async function loadMessages() {
      const qs = `page=${currentPage}&page_size=${pageSize}`;
      try {
        const r = await fetch('/api/my-notifications?'+qs); const d = await r.json();
        if (d.ok) { messages = d.notifications; total = d.total; render(); }
      } catch(e) { console.error(e); }
    }

    function render() {
      const box = document.getElementById('msgList');
      if (!messages.length) { box.innerHTML = '<div class="empty-tip">暂无消息通知</div>'; renderPagination(); return; }
      box.innerHTML = messages.map(m => `
        <article class="msg-card ${m.is_read?'read':''}" onclick="openMessage(${m.id})">
          ${m.is_read?'':'<span class="dot"></span>'}
          <div class="msg-top"><div class="msg-title">${escapeHtml(m.title)}</div><div class="msg-time">${escapeHtml(m.published_at)}</div></div>
          <div class="msg-body">${escapeHtml(m.content)}</div>
          <span class="msg-tag">${escapeHtml(m.type_display)}</span>
        </article>
      `).join('');
      renderPagination();
    }

    function renderPagination() {
      const tp = Math.max(1, Math.ceil(total/pageSize));
      document.getElementById('paginationBtns').innerHTML = tp <= 1 ? '' :
        `<button class="page-btn" onclick="goPage(${currentPage-1})" ${currentPage===1?'disabled':''}>‹</button>` +
        Array.from({length:tp},(_,i)=>`<button class="page-btn ${i+1===currentPage?'active':''}" onclick="goPage(${i+1})">${i+1}</button>`).join('') +
        `<button class="page-btn" onclick="goPage(${currentPage+1})" ${currentPage===tp?'disabled':''}>›</button>`;
    }

    function goPage(p) { const tp=Math.max(1,Math.ceil(total/pageSize)); if(p<1||p>tp) return; currentPage=p; loadMessages(); }

    async function openMessage(id) {
      try {
        const r = await fetch(`/api/my-notifications/${id}/read`, { method:'POST', headers:jsonHeaders() });
        const d = await r.json();
        if (d.ok) { loadMessages(); notifyParentBadge(); showToast('已标记为已读'); }
      } catch(e) { showToast('网络错误'); }
    }

    async function markAllRead() {
      try {
        const r = await fetch('/api/my-notifications/read-all', { method:'POST', headers:jsonHeaders() });
        const d = await r.json();
        if (d.ok) { loadMessages(); notifyParentBadge(); showToast('已全部标记为已读'); }
      } catch(e) { showToast('网络错误'); }
    }

    function showToast(msg) { const t=document.getElementById('toast'); t.textContent=msg; t.classList.add('show'); setTimeout(()=>t.classList.remove('show'),2200); }
    function escapeHtml(s) { const d=document.createElement('div'); d.textContent=s==null?'':String(s); return d.innerHTML; }

    loadMessages();
  </script>
</body>
</html>
