<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>用户管理</title>
  <style>
    @import url('https://fonts.googleapis.com/css2?family=Noto+Sans+SC:wght@300;400;500;600;700;800&display=swap');
    * { margin:0; padding:0; box-sizing:border-box; }
    :root { --blue:#3B82F6; --blue-dark:#2563EB; --blue-soft:#EFF6FF; --cyan:#12B7EE; --green:#22C55E; --orange:#F59E0B; --red:#EF4444; --ink:#172033; --muted:#7E8DA8; --line:#E3EBF5; --panel:#F5F8FC; --white:#FFFFFF; --shadow:0 14px 34px rgba(29,45,74,.08); }
    body { height:100vh; overflow:hidden; display:flex; flex-direction:column; padding:12px 18px 10px; background:radial-gradient(circle at 8% 8%,rgba(191,219,254,.5),transparent 28%),radial-gradient(circle at 92% 12%,rgba(165,180,252,.45),transparent 26%),#F7FAFC; color:var(--ink); font-family:'Noto Sans SC','Microsoft YaHei',sans-serif; }
    .toolbar { display:grid; grid-template-columns:320px 150px 150px auto minmax(40px,1fr) auto; gap:12px; padding:10px 12px; margin-bottom:10px; border:1px solid var(--line); border-radius:16px; background:rgba(255,255,255,.92); box-shadow:0 10px 26px rgba(29,45,74,.06); }
    .field { height:34px; width:100%; padding:0 12px; border:1px solid #DDE8F4; border-radius:11px; background:#FBFDFF; color:#25324A; font-size:13px; font-family:inherit; outline:none; transition:.16s ease; }
    .field:focus { border-color:#93C5FD; background:#fff; box-shadow:0 0 0 3px rgba(59,130,246,.08); }
    .btn { height:34px; display:inline-flex; align-items:center; justify-content:center; gap:7px; padding:0 15px; border:1px solid #DDE8F4; border-radius:11px; background:var(--white); color:#43516A; font-size:13px; font-weight:700; font-family:inherit; cursor:pointer; transition:.18s ease; box-shadow:0 5px 16px rgba(33,51,84,.05); }
    .btn:hover { transform:translateY(-1px); border-color:#B8C8DF; }
    .btn-primary { border-color:#3B82F6; background:linear-gradient(135deg,#60A5FA,#2563EB); color:#fff; box-shadow:0 10px 22px rgba(37,99,235,.22); }
    .table-card { flex:1; min-height:0; display:flex; flex-direction:column; overflow:hidden; border:1px solid var(--line); border-radius:18px; background:var(--white); box-shadow:var(--shadow); }
    .table-wrap { flex:1; overflow-y:auto; min-height:0; }
    table { width:100%; table-layout:fixed; border-collapse:collapse; }
    thead { background:linear-gradient(180deg,#F8FBFF,#F2F6FB); }
    th { height:38px; padding:8px 10px; text-align:center; font-size:12px; color:#73829A; font-weight:800; letter-spacing:.3px; border-bottom:1px solid #E8EEF7; }
    td { padding:0 10px; border-bottom:1px solid #EEF3F8; font-size:12px; color:#26344D; vertical-align:middle; text-align:center; overflow:hidden; text-overflow:ellipsis; white-space:nowrap; }
    tbody tr { transition:.14s ease; }
    tbody tr:hover { background:#F8FBFF; }
    tbody tr:last-child td { border-bottom:none; }
    .user-cell { display:flex; align-items:center; justify-content:center; gap:10px; }
    .avatar { width:30px; height:30px; display:grid; place-items:center; border-radius:11px; background:linear-gradient(135deg,#93C5FD,#A5B4FC); color:#fff; font-size:14px; font-weight:800; flex-shrink:0; }
    .avatar img { width:100%; height:100%; object-fit:cover; border-radius:10px; }
    .user-name { font-weight:800; color:#1F2D44; }
    .user-id { margin-top:2px; font-size:11px; color:#93A1B8; }
    .tag { display:inline-flex; align-items:center; justify-content:center; padding:4px 10px; border-radius:999px; font-size:12px; font-weight:800; }
    .tag.admin { background:#EFF6FF; color:#2563EB; }
    .tag.teacher { background:#ECFDF5; color:#059669; }
    .tag.operator { background:#FFF7ED; color:#D97706; }
    .tag.active { background:#F0FDF4; color:#16A34A; }
    .tag.paused { background:#FEF2F2; color:#DC2626; }
    .actions { display:flex; justify-content:center; gap:6px; }
    .text-btn { border:none; border-radius:8px; padding:6px 10px; background:transparent; color:#3B82F6; font-size:12px; font-weight:800; font-family:inherit; cursor:pointer; transition:.14s ease; }
    .text-btn:hover { background:#EFF6FF; }
    .text-btn.danger { color:#EF4444; }
    .text-btn.danger:hover { background:#FEF2F2; }
    .pagination { flex-shrink:0; display:flex; align-items:center; justify-content:space-between; padding:9px 14px; border-top:1px solid #EEF3F8; color:#7E8DA8; font-size:12px; font-weight:700; }
    .pages { display:flex; gap:6px; }
    .page-btn { min-width:30px; height:30px; border:1px solid #DDE8F4; border-radius:9px; background:#fff; color:#5C6C84; cursor:pointer; font-family:inherit; font-weight:800; }
    .page-btn.active { border-color:#3B82F6; background:#3B82F6; color:#fff; }
    .modal-mask { position:fixed; inset:0; z-index:100; display:none; align-items:center; justify-content:center; padding:20px; background:rgba(18,28,45,.42); backdrop-filter:blur(5px); }
    .modal-mask.show { display:flex; }
    .modal { width:520px; max-width:92vw; overflow:hidden; border-radius:18px; background:#fff; box-shadow:0 30px 80px rgba(16,30,54,.24); animation:modalIn .2s ease-out; }
    @keyframes modalIn { from { opacity:0; transform:translateY(12px) scale(.98); } to { opacity:1; transform:translateY(0) scale(1); } }
    .modal-head { display:flex; align-items:center; justify-content:space-between; padding:18px 20px; background:linear-gradient(135deg,#F7FBFF,#EEF6FF); border-bottom:1px solid #E7EEF8; }
    .modal-title { font-size:17px; font-weight:800; color:#1F2D44; }
    .modal-close { width:32px; height:32px; border:none; border-radius:9px; background:#fff; color:#8A98AF; cursor:pointer; font-size:18px; }
    .modal-body { display:grid; grid-template-columns:repeat(2,1fr); gap:12px; padding:20px; }
    .form-item.full { grid-column:1/-1; }
    .form-label { display:block; margin-bottom:7px; color:#64748B; font-size:12px; font-weight:800; }
    .modal-foot { display:flex; justify-content:flex-end; gap:10px; padding:16px 20px 20px; border-top:1px solid #EEF3F8; }
    .toast { position:fixed; right:22px; top:22px; z-index:120; padding:12px 18px; border-radius:12px; background:#172033; color:#fff; font-size:13px; font-weight:700; opacity:0; transform:translateY(-12px); transition:.25s ease; pointer-events:none; }
    .toast.show { opacity:1; transform:translateY(0); }
  </style>
</head>
<body>
  {% csrf_token %}
  <!-- 工具栏 -->
  <section class="toolbar">
    <input class="field" id="keywordInput" placeholder="搜索姓名、账号、手机号" oninput="searchUsers()">
    <select class="field" id="roleFilter" onchange="searchUsers()">
      <option value="">全部角色</option>
    </select>
    <select class="field" id="statusFilter" onchange="searchUsers()">
      <option value="">全部状态</option>
      <option value="active">启用</option>
      <option value="inactive">停用</option>
    </select>
    <button class="btn" onclick="resetFilters()">重置</button>
    <span></span>
    <button class="btn btn-primary" onclick="openModal('add')">新增用户</button>
  </section>

  <!-- 表格 -->
  <section class="table-card">
    <div class="table-wrap">
      <table>
        <colgroup>
          <col style="width:6%"><col style="width:8%"><col style="width:9%">
          <col style="width:8%"><col style="width:12%"><col style="width:11%">
          <col style="width:14%"><col style="width:13%"><col style="width:7%">
          <col style="width:12%">
        </colgroup>
        <thead>
          <tr>
            <th>头像</th><th>姓名</th><th>用户名</th><th>角色</th>
            <th>所属部门</th><th>手机号</th><th>邮箱</th><th>最近登录</th>
            <th>状态</th><th>操作</th>
          </tr>
        </thead>
        <tbody id="userTableBody"><tr><td colspan="10" style="text-align:center;color:var(--muted);">加载中...</td></tr></tbody>
      </table>
    </div>
    <div class="pagination">
      <span id="pageInfo">共 0 条记录</span>
      <div class="pages" id="paginationBtns"></div>
    </div>
  </section>

  <!-- 新增/编辑弹窗 -->
  <div class="modal-mask" id="userModal" onclick="closeModal(event)">
    <div class="modal" onclick="event.stopPropagation()">
      <div class="modal-head">
        <div class="modal-title" id="modalTitle">新增用户</div>
        <button class="modal-close" onclick="hideModal()">×</button>
      </div>
      <div class="modal-body">
        <div class="form-item">
          <label class="form-label">姓名</label>
          <input class="field" id="formRealName" placeholder="请输入姓名">
        </div>
        <div class="form-item">
          <label class="form-label">账号</label>
          <input class="field" id="formUsername" placeholder="请输入账号">
        </div>
        <div class="form-item">
          <label class="form-label">角色</label>
          <select class="field" id="formRole"><option value="">请选择角色</option></select>
        </div>
        <div class="form-item">
          <label class="form-label">所属部门</label>
          <input class="field" id="formDept" placeholder="如：智能制造学院">
        </div>
        <div class="form-item full">
          <label class="form-label">手机号</label>
          <input class="field" id="formPhone" placeholder="请输入手机号">
        </div>
        <div class="form-item full">
          <label class="form-label">邮箱</label>
          <input class="field" id="formEmail" placeholder="请输入邮箱">
        </div>
      </div>
      <div class="modal-foot">
        <button class="btn" onclick="hideModal()">取消</button>
        <button class="btn btn-primary" onclick="saveUser()">保存</button>
      </div>
    </div>
  </div>

  <!-- Toast -->
  <div class="toast" id="toast"></div>

  <script>
    // CSRF 令牌（从 Django 设置的 cookie 中读取）
    function getCookie(n){if(document.cookie){for(const c of document.cookie.split(';')){const t=c.trim();if(t.startsWith(n+'='))return decodeURIComponent(t.substring(n.length+1))}}return null}
    const csrftoken = getCookie('csrftoken');
    const jsonHeaders = () => { const h={'Content-Type':'application/json'}; if(csrftoken) h['X-CSRFToken']=csrftoken; return h; };

    let users = [], roles = [], total = 0, currentPage = 1, pageSize = 10;
    function fitRows() { const w=document.querySelector('.table-wrap'); if(w) document.querySelectorAll('td').forEach(td=>td.style.height=(w.clientHeight/10)+'px'); }
    let editingUserId = null;

    // ===== 加载角色列表（筛选下拉 + 弹窗下拉共用） =====
    async function loadRoles() {
      try {
        const r = await fetch('/api/roles');
        const d = await r.json();
        if (d.ok) {
          roles = d.roles || [];
          const roleFilter = document.getElementById('roleFilter');
          roles.forEach(role => { roleFilter.add(new Option(role.name, role.id)); });
          const formRole = document.getElementById('formRole');
          roles.forEach(role => { formRole.add(new Option(role.name, role.id)); });
        }
      } catch(e) { console.error(e); }
    }

    // ===== 加载用户列表 =====
    async function loadUsers() {
      const keyword = document.getElementById('keywordInput').value.trim();
      const roleId = document.getElementById('roleFilter').value;
      const status = document.getElementById('statusFilter').value;
      let url = `/api/users?page=${currentPage}&page_size=${pageSize}`;
      if (keyword) url += '&keyword=' + encodeURIComponent(keyword);
      if (roleId) url += '&role=' + roleId;
      if (status) url += '&status=' + status;
      try {
        const r = await fetch(url);
        const d = await r.json();
        if (d.ok) { users = d.users || []; total = d.total || 0; renderTable(); renderPagination(); }
      } catch(e) { console.error(e); }
    }

    // ===== 渲染表格 =====
    function renderTable() {
      const tbody = document.getElementById('userTableBody');
      if (!users.length) { tbody.innerHTML = '<tr><td colspan="10" style="text-align:center;color:var(--muted);">暂无数据</td></tr>'; return; }
      tbody.innerHTML = users.map(u => {
        const initial = (u.real_name || u.username).charAt(0);
        const avatarHtml = u.avatar ? `<img src="${escapeHtml(u.avatar)}">` : initial;
        const roleName = u.role ? u.role.name : '—';
        const roleClass = roleTagClass(roleName);
        const lastLogin = u.last_login || '—';
        const statusTag = u.is_active ? '<span class="tag active">启用</span>' : '<span class="tag paused">停用</span>';
        const toggleLabel = u.is_active ? '停用' : '启用';
        return `<tr>
          <td><div class="user-cell"><div class="avatar">${avatarHtml}</div></div></td>
          <td><span class="user-name">${escapeHtml(u.real_name || u.username)}</span></td>
          <td><span class="user-id">@${escapeHtml(u.username)}</span></td>
          <td><span class="tag ${roleClass}">${escapeHtml(roleName)}</span></td>
          <td>${escapeHtml(u.dept || '—')}</td>
          <td>${escapeHtml(u.phone || '—')}</td>
          <td>${escapeHtml(u.email || '—')}</td>
          <td>${escapeHtml(lastLogin)}</td>
          <td>${statusTag}</td>
          <td>
            <div class="actions">
              <button class="text-btn" onclick="openModal('edit',${u.id})">编辑</button>
              <button class="text-btn" onclick="toggleStatus(${u.id},${!u.is_active})">${toggleLabel}</button>
              <button class="text-btn danger" onclick="deleteUser(${u.id},'${escapeAttr(u.real_name||u.username)}')">删除</button>
            </div>
          </td>
        </tr>`;
      }).join('');
      setTimeout(fitRows, 0);
    }

    window.addEventListener('resize', fitRows);

    // ===== 分页 =====
    function renderPagination() {
      const totalPages = Math.max(1, Math.ceil(total / pageSize));
      document.getElementById('pageInfo').textContent = `共 ${total} 条记录，第 ${currentPage}/${totalPages} 页`;
      let html = `<button class="page-btn" onclick="goPage(${currentPage-1})" ${currentPage===1?'disabled':''}>‹</button>`;
      for (let i=1; i<=totalPages; i++) html += `<button class="page-btn ${i===currentPage?'active':''}" onclick="goPage(${i})">${i}</button>`;
      html += `<button class="page-btn" onclick="goPage(${currentPage+1})" ${currentPage===totalPages?'disabled':''}>›</button>`;
      document.getElementById('paginationBtns').innerHTML = html;
    }
    function goPage(p) { const totalPages = Math.max(1,Math.ceil(total/pageSize)); if (p<1||p>totalPages) return; currentPage=p; loadUsers(); }
    function searchUsers() { currentPage=1; loadUsers(); }
    function resetFilters() { document.getElementById('keywordInput').value=''; document.getElementById('roleFilter').value=''; document.getElementById('statusFilter').value=''; currentPage=1; loadUsers(); }

    // ===== 弹窗 =====
    function openModal(mode, userId) {
      editingUserId = mode === 'edit' ? userId : null;
      document.getElementById('modalTitle').textContent = mode === 'edit' ? '编辑用户' : '新增用户';
      document.getElementById('formUsername').disabled = (mode === 'edit');
      if (mode === 'edit') {
        const u = users.find(x => x.id === userId);
        if (!u) return;
        document.getElementById('formRealName').value = u.real_name || '';
        document.getElementById('formUsername').value = u.username;
        document.getElementById('formRole').value = u.role ? u.role.id : '';
        document.getElementById('formDept').value = u.dept || '';
        document.getElementById('formPhone').value = u.phone || '';
        document.getElementById('formEmail').value = u.email || '';
      } else {
        ['formRealName','formUsername','formDept','formPhone','formEmail'].forEach(id => document.getElementById(id).value='');
        document.getElementById('formUsername').disabled = false;
        document.getElementById('formRole').value = '';
      }
      document.getElementById('userModal').classList.add('show');
    }
    function hideModal() { document.getElementById('userModal').classList.remove('show'); }
    function closeModal(e) { if (e.target.id === 'userModal') hideModal(); }

    // ===== 保存 =====
    async function saveUser() {
      const username = document.getElementById('formUsername').value.trim();
      const realName = document.getElementById('formRealName').value.trim();
      const roleId = document.getElementById('formRole').value;
      if (!username) return showToast('请输入账号');
      if (!realName) return showToast('请输入姓名');
      if (!roleId) return showToast('请选择角色');
      const payload = { username, real_name: realName, role_id: roleId || null, dept: document.getElementById('formDept').value.trim(), phone: document.getElementById('formPhone').value.trim(), email: document.getElementById('formEmail').value.trim() };
      try {
        let r;
        if (editingUserId) {
          r = await fetch(`/api/users/${editingUserId}`, { method:'PATCH', headers:jsonHeaders(), body:JSON.stringify({real_name:payload.real_name,role_id:payload.role_id,dept:payload.dept,phone:payload.phone,email:payload.email}) });
        } else {
          r = await fetch('/api/users', { method:'POST', headers:jsonHeaders(), body:JSON.stringify(payload) });
        }
        const d = await r.json();
        if (d.ok) { hideModal(); loadUsers(); showToast(editingUserId?'用户信息已保存':'用户已新增'); }
        else { showToast(d.error || '操作失败'); }
      } catch(e) { showToast('网络错误'); }
    }

    // ===== 操作 =====
    async function toggleStatus(userId, isActive) {
      try {
        const r = await fetch(`/api/users/${userId}/status`, { method:'PATCH', headers:jsonHeaders(), body:JSON.stringify({is_active:isActive}) });
        const d = await r.json();
        if (d.ok) { loadUsers(); showToast(isActive?'已启用':'已停用'); }
        else { showToast(d.error || '操作失败'); }
      } catch(e) { showToast('网络错误'); }
    }
    async function deleteUser(userId, name) {
      if (!confirm(`确定要删除用户「${name}」吗？`)) return;
      try {
        const r = await fetch(`/api/users/${userId}`, { method:'DELETE', headers:jsonHeaders() });
        const d = await r.json();
        if (d.ok) { currentPage = 1; loadUsers(); showToast('已删除'); }
        else { showToast(d.error || '删除失败'); }
      } catch(e) { showToast('网络错误'); }
    }

    // ===== 工具函数 =====
    function roleTagClass(name) { if (name==='超级管理员'||name==='管理员') return 'admin'; if (name==='教师') return 'teacher'; return 'operator'; }
    function showToast(msg) { const t=document.getElementById('toast'); t.textContent=msg; t.classList.add('show'); setTimeout(()=>t.classList.remove('show'),2200); }
    function escapeHtml(s) { const d=document.createElement('div'); d.textContent=s||''; return d.innerHTML; }
    function escapeAttr(s) { return escapeHtml(s).replace(/"/g,'&quot;'); }

    // ===== 启动 =====
    loadRoles().then(() => loadUsers());
  </script>
</body>
</html>
