<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>用户管理</title>
  <style>
    /* 使用系统字体 */
    * { margin:0; padding:0; box-sizing:border-box; }
    body { font-family:-apple-system,BlinkMacSystemFont,'PingFang SC','Microsoft YaHei',sans-serif; background:#F7FAFC; }
    :root { --blue-primary:#3B82F6; --border:#E2E8F0; --text:#1A202C; --hint:#A0AEC0; --radius:8px; }
    .page-header { display:flex; justify-content:space-between; align-items:center; margin-bottom:20px; }
    .page-header h2 { font-size:20px; font-weight:700; }
    .btn { padding:8px 18px; border:none; border-radius:var(--radius); font-size:13px; cursor:pointer; }
    .btn-primary { background:var(--blue-primary); color:white; }
    table { width:100%; border-collapse:collapse; background:white; border-radius:10px; overflow:hidden; }
    th { background:#F7FAFC; padding:12px 16px; text-align:left; font-size:12px; color:var(--hint); border-bottom:1px solid var(--border); }
    td { padding:12px 16px; font-size:13px; border-bottom:1px solid var(--border); }
    .status { display:inline-block; width:6px; height:6px; border-radius:50%; margin-right:6px; }
    .status.on { background:#38A169; }
  </style>
</head>
<body>
  <div class="page-header">
    <h2>用户管理</h2>
    <button class="btn btn-primary" onclick="window.open('/admin/auth/user/add/','_blank')">+ 新增用户</button>
  </div>
  <p style="color:var(--hint);margin-bottom:16px;">用户管理通过 Django 后台操作，点击上方按钮进入</p>
  <table>
    <thead><tr><th>用户名</th><th>邮箱</th><th>角色</th><th>状态</th><th>最后登录</th></tr></thead>
    <tbody id="userTable"><tr><td colspan="5" style="text-align:center;color:var(--hint);">加载中...</td></tr></tbody>
  </table>
  <script>
  fetch("/api/auth/me").then(r=>r.json()).then(u=>{
    document.getElementById("userTable").innerHTML = `<tr>
      <td><span class="status on"></span> ${u.name||'admin'}</td>
      <td>-</td><td>${u.role||'专业负责人'}</td><td>正常</td><td>现在</td></tr>`;
  });
  </script>
</body>
</html>
