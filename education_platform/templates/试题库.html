<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>课程试题</title>
  <style>
    @import url('https://fonts.googleapis.com/css2?family=Noto+Sans+SC:wght@300;400;500;600;700;800&display=swap');
    * { margin:0; padding:0; box-sizing:border-box; }
    :root { --blue:#3B82F6; --ink:#172033; --muted:#7E8DA8; --line:#E3EBF5; --white:#FFFFFF; --shadow:0 14px 34px rgba(29,45,74,.08); }
    body { height:100vh; overflow:hidden; display:flex; flex-direction:column; padding:12px 18px 10px; background:radial-gradient(circle at 8% 8%,rgba(191,219,254,.5),transparent 28%),radial-gradient(circle at 92% 12%,rgba(165,180,252,.45),transparent 26%),#F7FAFC; color:var(--ink); font-family:'Noto Sans SC','Microsoft YaHei',sans-serif; }
    .toolbar { display:flex; align-items:center; gap:12px; flex-wrap:wrap; padding:10px 12px; margin-bottom:12px; border:1px solid var(--line); border-radius:16px; background:rgba(255,255,255,.92); box-shadow:0 10px 26px rgba(29,45,74,.06); }
    .field { height:34px; padding:0 12px; border:1px solid #DDE8F4; border-radius:11px; background:#FBFDFF; color:#25324A; font-size:13px; font-family:inherit; outline:none; }
    .field.search { flex:1; min-width:200px; max-width:320px; }
    .field:focus { border-color:#93C5FD; background:#fff; box-shadow:0 0 0 3px rgba(59,130,246,.08); }
    .btn { height:34px; display:inline-flex; align-items:center; justify-content:center; padding:0 14px; border:1px solid #DDE8F4; border-radius:11px; background:var(--white); color:#43516A; font-size:13px; font-weight:700; font-family:inherit; cursor:pointer; transition:.18s ease; }
    .btn:hover { border-color:#B8C8DF; }
    .count { font-size:12px; color:var(--muted); font-weight:700; margin-left:auto; }

    .table-card { flex:1; min-height:0; display:flex; flex-direction:column; overflow:hidden; border:1px solid var(--line); border-radius:18px; background:var(--white); box-shadow:var(--shadow); }
    .table-wrap { flex:1; overflow-y:auto; min-height:0; }
    table { width:100%; table-layout:fixed; border-collapse:collapse; }
    thead { background:linear-gradient(180deg,#F8FBFF,#F2F6FB); position:sticky; top:0; z-index:1; }
    th { height:40px; padding:8px 10px; text-align:center; font-size:12px; color:#73829A; font-weight:800; border-bottom:1px solid #E8EEF7; }
    td { padding:10px; border-bottom:1px solid #EEF3F8; font-size:13px; color:#334155; vertical-align:middle; text-align:center; }
    td.stem-cell { text-align:left; }
    tbody tr { transition:.14s ease; } tbody tr:hover { background:#F8FBFF; }
    .qtype { display:inline-flex; padding:2px 9px; border-radius:7px; font-size:11px; font-weight:800; }
    .qtype.single { background:#DBEAFE; color:#2563EB; }
    .qtype.multiple { background:#D1FAE5; color:#059669; }
    .qtype.judgment { background:#FEF3C7; color:#D97706; }
    .qtype.short { background:#EDE9FE; color:#7C3AED; }
    .path-cell { color:#64748B; font-size:12px; }
    .text-btn { border:none; border-radius:8px; padding:6px 10px; background:transparent; color:#3B82F6; font-size:12px; font-weight:800; font-family:inherit; cursor:pointer; }
    .text-btn:hover { background:#EFF6FF; }
    .pagination { flex-shrink:0; display:flex; align-items:center; justify-content:space-between; padding:9px 14px; border-top:1px solid #EEF3F8; color:#7E8DA8; font-size:12px; font-weight:700; }
    .pages { display:flex; gap:6px; } .page-btn { min-width:30px; height:30px; border:1px solid #DDE8F4; border-radius:9px; background:#fff; color:#5C6C84; cursor:pointer; font-family:inherit; font-weight:800; } .page-btn.active { border-color:#3B82F6; background:#3B82F6; color:#fff; }

    .modal-mask { position:fixed; inset:0; z-index:100; display:none; align-items:center; justify-content:center; padding:20px; background:rgba(18,28,45,.42); backdrop-filter:blur(5px); } .modal-mask.show { display:flex; }
    .modal { width:640px; max-width:94vw; max-height:90vh; overflow:auto; border-radius:18px; background:#fff; box-shadow:0 30px 80px rgba(16,30,54,.24); animation:modalIn .2s ease-out; }
    @keyframes modalIn { from{opacity:0;transform:translateY(12px)scale(.98)} to{opacity:1;transform:translateY(0)scale(1)} }
    .modal-head { display:flex; align-items:center; justify-content:space-between; padding:16px 20px; background:linear-gradient(135deg,#F7FBFF,#EEF6FF); border-bottom:1px solid #E7EEF8; }
    .modal-title { font-size:16px; font-weight:800; color:#1F2D44; }
    .modal-close { width:32px; height:32px; border:none; border-radius:9px; background:#fff; color:#8A98AF; cursor:pointer; font-size:18px; }
    .modal-body { padding:20px; }
    .q-stem { font-size:15px; font-weight:700; color:#1F2D44; line-height:1.6; margin-bottom:14px; }
    .q-opt { padding:8px 12px; border:1px solid #E3EBF4; border-radius:9px; font-size:13px; color:#43516A; margin-bottom:8px; }
    .q-answer { padding:10px 12px; border-radius:9px; background:#F0FDF4; color:#15803d; font-size:13px; font-weight:600; margin:14px 0; }
    .q-analysis { padding:10px 12px; border-radius:9px; background:#F8FAFC; color:#64748B; font-size:13px; line-height:1.6; }
    .q-meta { font-size:12px; color:var(--muted); margin-bottom:14px; }
    .hint { font-size:12px; color:var(--muted); margin-top:14px; text-align:center; }
  </style>
</head>
<body>
  {% csrf_token %}
  <section class="toolbar">
    <input class="field search" id="keywordInput" placeholder="搜索题干、课程、章节、知识点" oninput="searchList()">
    <select class="field" id="typeFilter" onchange="searchList()">
      <option value="">全部题型</option>
      <option value="single">单选题</option>
      <option value="multiple">多选题</option>
      <option value="judgment">判断题</option>
      <option value="short">简答题</option>
    </select>
    <select class="field" id="courseFilter" onchange="searchList()"><option value="">全部课程</option></select>
    <button class="btn" onclick="resetFilters()">重置</button>
    <span class="count" id="countText">共 0 道试题</span>
  </section>

  <section class="table-card">
    <div class="table-wrap">
      <table>
        <colgroup><col style="width:5%"><col style="width:10%"><col style="width:38%"><col style="width:24%"><col style="width:15%"><col style="width:8%"></colgroup>
        <thead><tr><th>#</th><th>题型</th><th>题干</th><th>归属</th><th>更新时间</th><th>操作</th></tr></thead>
        <tbody id="tableBody"><tr><td colspan="6" style="text-align:center;color:var(--muted);">加载中...</td></tr></tbody>
      </table>
    </div>
    <div class="pagination"><span id="pageInfo">共 0 条</span><div class="pages" id="paginationBtns"></div></div>
  </section>

  <!-- 试题详情弹窗 -->
  <div class="modal-mask" id="detailModal" onclick="closeModal(event,'detailModal')">
    <div class="modal" onclick="event.stopPropagation()">
      <div class="modal-head"><div class="modal-title" id="detailTitle">试题详情</div><button class="modal-close" onclick="hideModal('detailModal')">×</button></div>
      <div class="modal-body" id="detailBody"></div>
    </div>
  </div>

  <script>
    function getCookie(n){if(document.cookie){for(const c of document.cookie.split(';')){const t=c.trim();if(t.startsWith(n+'='))return decodeURIComponent(t.substring(n.length+1))}}return null}
    const csrftoken = getCookie('csrftoken');
    const jsonHeaders = () => { const h={'Content-Type':'application/json'}; if(csrftoken) h['X-CSRFToken']=csrftoken; return h; };

    let questions = [], total = 0, currentPage = 1, pageSize = 10;
    const typeCls = { single:'single', multiple:'multiple', judgment:'judgment', short:'short' };

    async function loadCourses() {
      try {
        const r = await fetch('/api/teaching/questions/course-options'); const d = await r.json();
        if (d.ok) {
          document.getElementById('courseFilter').innerHTML = '<option value="">全部课程</option>' +
            d.courses.map(c => `<option value="${c.id}">${escapeHtml(c.name)}</option>`).join('');
        }
      } catch(e) { console.error(e); }
    }

    async function loadQuestions() {
      const p = { page:currentPage, page_size:pageSize };
      const kw = document.getElementById('keywordInput').value.trim();
      if(kw) p.keyword = kw;
      const type = document.getElementById('typeFilter').value;
      if(type) p.question_type = type;
      const course = document.getElementById('courseFilter').value;
      if(course) p.course_tree_id = course;
      const qs = Object.entries(p).map(([k,v])=>k+'='+encodeURIComponent(v)).join('&');
      try {
        const r = await fetch('/api/teaching/questions?'+qs); const d = await r.json();
        if (d.ok) { questions = d.questions; total = d.total; renderTable(); renderPagination(); }
      } catch(e) { console.error(e); }
    }

    function renderTable() {
      document.getElementById('countText').textContent = `共 ${total} 道试题`;
      const tbody = document.getElementById('tableBody');
      if (!questions.length) { tbody.innerHTML = '<tr><td colspan="6" style="text-align:center;color:var(--muted);">暂无匹配的试题</td></tr>'; return; }
      const start = (currentPage - 1) * pageSize;
      tbody.innerHTML = questions.map((q, i) => `
        <tr>
          <td>${start + i + 1}</td>
          <td><span class="qtype ${typeCls[q.question_type]||''}">${escapeHtml(q.question_type_display)}</span></td>
          <td class="stem-cell">${escapeHtml(q.stem)}</td>
          <td class="path-cell">${escapeHtml(q.path)}</td>
          <td>${escapeHtml(q.updated_at)}</td>
          <td><button class="text-btn" onclick="openDetail(${q.id})">详情</button></td>
        </tr>
      `).join('');
    }

    function renderPagination() {
      const tp = Math.max(1, Math.ceil(total/pageSize));
      document.getElementById('pageInfo').textContent = `共 ${total} 条，第 ${currentPage}/${tp} 页`;
      let h = `<button class="page-btn" onclick="goPage(${currentPage-1})" ${currentPage===1?'disabled':''}>‹</button>`;
      for(let i=1;i<=tp;i++) h += `<button class="page-btn ${i===currentPage?'active':''}" onclick="goPage(${i})">${i}</button>`;
      h += `<button class="page-btn" onclick="goPage(${currentPage+1})" ${currentPage===tp?'disabled':''}>›</button>`;
      document.getElementById('paginationBtns').innerHTML = h;
    }

    function goPage(p) { const tp=Math.max(1,Math.ceil(total/pageSize)); if(p<1||p>tp) return; currentPage=p; loadQuestions(); }
    function searchList() { currentPage=1; loadQuestions(); }
    function resetFilters() { document.getElementById('keywordInput').value=''; document.getElementById('typeFilter').value=''; document.getElementById('courseFilter').value=''; currentPage=1; loadQuestions(); }

    function openDetail(id) {
      const q = questions.find(x => x.id === id); if (!q) return;
      document.getElementById('detailTitle').textContent = `${q.question_type_display} · 试题详情`;
      const opts = (q.options || []).length ? (q.options||[]).map(o => `<div class="q-opt">${escapeHtml(o)}</div>`).join('') : '';
      document.getElementById('detailBody').innerHTML = `
        <div class="q-meta">归属：${escapeHtml(q.path)}</div>
        <div class="q-stem">${escapeHtml(q.stem)}</div>
        ${opts}
        <div class="q-answer">参考答案：${escapeHtml((q.correct_answer||[]).join('、') || '（主观评分）')}</div>
        ${q.analysis ? `<div class="q-analysis">解析：${escapeHtml(q.analysis)}</div>` : ''}
        <div class="hint">编辑试题请前往「教育资源库」页对应知识点。</div>
      `;
      document.getElementById('detailModal').classList.add('show');
    }

    function hideModal(id) { document.getElementById(id).classList.remove('show'); }
    function closeModal(e,id) { if(e.target.id===id) hideModal(id); }
    function escapeHtml(s) { const d=document.createElement('div'); d.textContent=s==null?'':String(s); return d.innerHTML; }

    loadCourses();
    loadQuestions();
  </script>
</body>
</html>
