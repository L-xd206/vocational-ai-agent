<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>教育实训 - 登录</title>
  <style>
    /* 使用系统字体，避免 Google Fonts 被墙阻塞渲染 */

    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    :root {
      --blue-primary: #3B82F6;
      --blue-hover: #2563EB;
      --blue-light: #EFF6FF;
      --blue-subtle: #BFDBFE;
      --text-primary: #1A202C;
      --text-secondary: #718096;
      --text-hint: #A0AEC0;
      --border: #E2E8F0;
      --border-focus: #90CDF4;
      --white: #FFFFFF;
      --error: #E53E3E;
      --bg-page: #F7FAFC;
    }

    body {
      font-family: -apple-system, BlinkMacSystemFont, 'PingFang SC', 'Microsoft YaHei', sans-serif;
      background: var(--bg-page);
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      overflow: hidden;
      position: relative;
    }

    /* 左侧装饰面板 */
    .login-decor {
      position: fixed;
      left: 0;
      top: 0;
      width: 42%;
      height: 100vh;
      background: linear-gradient(120deg, #DBEAFE 0%, #BFDBFE 30%, #93C5FD 60%, #A5B4FC 100%);
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      color: #1E3A5F;
      z-index: 1;
      overflow: hidden;
    }

    .login-decor::before {
      content: '';
      position: absolute;
      top: -20%;
      right: -20%;
      width: 500px;
      height: 500px;
      border-radius: 50%;
      background: rgba(255,255,255,0.25);
    }

    .login-decor::after {
      content: '';
      position: absolute;
      bottom: -10%;
      left: -10%;
      width: 350px;
      height: 350px;
      border-radius: 50%;
      background: rgba(255,255,255,0.18);
    }

    .decor-icon {
      width: 80px;
      height: 80px;
      border: 2px solid rgba(30, 58, 95, 0.2);
      border-radius: 20px;
      display: flex;
      align-items: center;
      justify-content: center;
      margin-bottom: 28px;
      position: relative;
      z-index: 2;
    }

    .decor-icon svg {
      width: 40px;
      height: 40px;
      stroke: #3B82F6;
    }

    .decor-title {
      font-size: 28px;
      font-weight: 700;
      letter-spacing: 4px;
      margin-bottom: 12px;
      position: relative;
      z-index: 2;
    }

    .decor-subtitle {
      font-size: 14px;
      font-weight: 400;
      opacity: 0.6;
      letter-spacing: 1px;
      position: relative;
      z-index: 2;
    }

    /* 右侧登录区 */
    .login-right {
      margin-left: 21%;
      width: 420px;
      z-index: 2;
      animation: fadeSlideIn 0.6s ease-out;
    }

    @keyframes fadeSlideIn {
      from { opacity: 0; transform: translateY(16px); }
      to { opacity: 1; transform: translateY(0); }
    }

    .login-header {
      margin-bottom: 40px;
    }

    .login-header h1 {
      font-size: 26px;
      font-weight: 700;
      color: var(--text-primary);
      margin-bottom: 8px;
    }

    .login-header p {
      font-size: 14px;
      color: var(--text-hint);
    }

    /* 表单 */
    .form-group {
      margin-bottom: 22px;
      position: relative;
    }

    .form-label {
      display: block;
      font-size: 13px;
      font-weight: 500;
      color: var(--text-secondary);
      margin-bottom: 8px;
    }

    .input-wrapper {
      position: relative;
      display: flex;
      align-items: center;
    }

    .input-wrapper svg {
      position: absolute;
      left: 14px;
      width: 18px;
      height: 18px;
      stroke: var(--text-hint);
      pointer-events: none;
      transition: stroke 0.2s;
    }

    .form-input {
      width: 100%;
      height: 46px;
      padding: 0 14px 0 44px;
      border: 1.5px solid var(--border);
      border-radius: 10px;
      font-size: 14px;
      font-family: -apple-system, BlinkMacSystemFont, 'PingFang SC', 'Microsoft YaHei', sans-serif;
      color: var(--text-primary);
      background: var(--white);
      outline: none;
      transition: border-color 0.2s, box-shadow 0.2s;
    }

    .form-input::placeholder {
      color: var(--text-hint);
      font-weight: 300;
    }

    .form-input:focus {
      border-color: var(--border-focus);
      box-shadow: 0 0 0 3px rgba(59, 130, 246, 0.08);
    }

    .form-input:focus ~ svg,
    .input-wrapper:focus-within svg {
      stroke: var(--blue-primary);
    }

    .form-options {
      display: flex;
      align-items: center;
      justify-content: space-between;
      margin-bottom: 28px;
      font-size: 13px;
    }

    .remember-me {
      display: flex;
      align-items: center;
      gap: 6px;
      cursor: pointer;
      color: var(--text-secondary);
      user-select: none;
    }

    .remember-me input[type="checkbox"] {
      appearance: none;
      -webkit-appearance: none;
      width: 16px;
      height: 16px;
      border: 1.5px solid var(--border);
      border-radius: 4px;
      cursor: pointer;
      position: relative;
      transition: all 0.15s;
    }

    .remember-me input[type="checkbox"]:checked {
      background: var(--blue-primary);
      border-color: var(--blue-primary);
    }

    .remember-me input[type="checkbox"]:checked::after {
      content: '';
      position: absolute;
      left: 4.5px;
      top: 1.5px;
      width: 5px;
      height: 9px;
      border: solid white;
      border-width: 0 2px 2px 0;
      transform: rotate(45deg);
    }

    .forgot-link {
      color: var(--blue-primary);
      text-decoration: none;
      font-weight: 500;
      transition: color 0.2s;
      cursor: pointer;
    }

    .forgot-link:hover {
      color: var(--blue-hover);
    }

    .btn-login {
      width: 100%;
      height: 46px;
      background: linear-gradient(120deg, #DBEAFE 0%, #93C5FD 60%, #A5B4FC 100%);
      color: #3730A3;
      border: 1px solid rgba(147, 197, 253, 0.15);
      border-radius: 10px;
      font-size: 15px;
      font-weight: 600;
      font-family: -apple-system, BlinkMacSystemFont, 'PingFang SC', 'Microsoft YaHei', sans-serif;
      cursor: pointer;
      transition: all 0.2s;
      letter-spacing: 1px;
    }

    .btn-login:hover {
      box-shadow: 0 4px 14px rgba(147, 197, 253, 0.35);
      transform: translateY(-1px);
    }

    .btn-login:active {
      transform: scale(0.985);
    }

    /* 忘记密码弹窗 */
    .modal-overlay {
      display: none;
      position: fixed;
      inset: 0;
      background: rgba(0,0,0,0.4);
      z-index: 100;
      align-items: center;
      justify-content: center;
      backdrop-filter: blur(2px);
    }

    .modal-overlay.active {
      display: flex;
    }

    .modal {
      background: var(--white);
      border-radius: 16px;
      padding: 36px 32px;
      width: 420px;
      max-width: 90vw;
      box-shadow: 0 20px 60px rgba(0,0,0,0.15);
      animation: modalIn 0.3s ease-out;
    }

    @keyframes modalIn {
      from { opacity: 0; transform: translateY(-12px) scale(0.97); }
      to { opacity: 1; transform: translateY(0) scale(1); }
    }

    .modal-header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      margin-bottom: 20px;
    }

    .modal-header h2 {
      font-size: 18px;
      font-weight: 700;
      color: var(--text-primary);
    }

    .modal-close {
      width: 32px;
      height: 32px;
      border: none;
      background: var(--bg-page);
      border-radius: 8px;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      transition: background 0.2s;
    }

    .modal-close:hover {
      background: var(--border);
    }

    .modal-close svg {
      width: 16px;
      height: 16px;
      stroke: var(--text-secondary);
    }

    .modal-desc {
      font-size: 13px;
      color: var(--text-secondary);
      margin-bottom: 24px;
      line-height: 1.6;
    }

    .modal-divider {
      height: 1px;
      background: var(--border);
      margin: 20px 0;
    }

    .section-label {
      font-size: 12px;
      font-weight: 600;
      color: var(--text-hint);
      text-transform: uppercase;
      letter-spacing: 0.5px;
      margin-bottom: 12px;
    }

    .phone-row {
      margin-bottom: 20px;
    }

    .btn-send-code {
      flex-shrink: 0;
      width: 120px;
      height: 46px;
      background: var(--blue-light);
      color: var(--blue-primary);
      border: 1.5px solid var(--border-focus);
      border-radius: 10px;
      font-size: 13px;
      font-weight: 500;
      font-family: -apple-system, BlinkMacSystemFont, 'PingFang SC', 'Microsoft YaHei', sans-serif;
      cursor: pointer;
      transition: all 0.2s;
    }

    .btn-send-code:hover:not(:disabled) {
      background: var(--blue-subtle);
    }

    .btn-send-code:disabled {
      opacity: 0.6;
      cursor: not-allowed;
    }

    .code-row {
      display: flex;
      gap: 10px;
      margin-bottom: 20px;
    }

    .code-row .form-input {
      flex: 1;
    }

    .btn-primary {
      width: 100%;
      height: 46px;
      background: linear-gradient(120deg, #DBEAFE 0%, #93C5FD 60%, #A5B4FC 100%);
      color: #3730A3;
      border: 1px solid rgba(147, 197, 253, 0.15);
      border-radius: 10px;
      font-size: 14px;
      font-weight: 600;
      font-family: -apple-system, BlinkMacSystemFont, 'PingFang SC', 'Microsoft YaHei', sans-serif;
      cursor: pointer;
      transition: all 0.2s;
    }

    .btn-primary:hover {
      box-shadow: 0 4px 14px rgba(147, 197, 253, 0.35);
      transform: translateY(-1px);
    }

    /* Toast 提示 */
    .toast {
      position: fixed;
      top: 24px;
      left: 50%;
      transform: translateX(-50%) translateY(-80px);
      background: var(--text-primary);
      color: var(--white);
      padding: 12px 24px;
      border-radius: 10px;
      font-size: 13px;
      z-index: 200;
      opacity: 0;
      transition: all 0.35s ease;
      pointer-events: none;
    }

    .toast.show {
      opacity: 1;
      transform: translateX(-50%) translateY(0);
    }

    /* 响应式 */
    @media (max-width: 900px) {
      .login-decor { display: none; }
      .login-right { margin-left: 0; width: 90%; }
    }
  </style>
</head>
<body>

  <!-- 左侧装饰面板 -->
  <div class="login-decor">
    <div class="decor-icon">
      <svg fill="none" viewBox="0 0 24 24" stroke-width="1.5">
        <path stroke-linecap="round" stroke-linejoin="round" d="M4.26 10.147a60.438 60.438 0 0 0-.491 6.347A48.62 48.62 0 0 1 12 20.904a48.62 48.62 0 0 1 8.232-4.41 60.46 60.46 0 0 0-.491-6.347m-15.482 0a50.636 50.636 0 0 0-2.658-.813A59.906 59.906 0 0 1 12 3.493a59.903 59.903 0 0 1 10.399 5.84c-.896.248-1.783.52-2.658.814m-15.482 0A50.717 50.717 0 0 1 12 13.489a50.702 50.702 0 0 1 7.74-3.342M6.75 15a.75.75 0 1 0 0-1.5.75.75 0 0 0 0 1.5Zm0 0v-3.675A55.378 55.378 0 0 1 12 8.443m-7.007 11.55A5.981 5.981 0 0 0 6.75 15.75v-1.5"/>
      </svg>
    </div>
    <div class="decor-title">教育实训平台</div>
    <div class="decor-subtitle">Education & Training Platform</div>
  </div>

  <!-- 登录表单 -->
  <div class="login-right">
    <div class="login-header">
      <h1>欢迎登录</h1>
      <p>请输入您的账号和密码以继续</p>
    </div>

    <form id="loginForm" onsubmit="return handleLogin(event)">
      <div class="form-group">
        <label class="form-label">账号</label>
        <div class="input-wrapper">
          <input type="text" class="form-input" placeholder="请输入账号">
          <svg fill="none" viewBox="0 0 24 24" stroke-width="1.5">
            <path stroke-linecap="round" stroke-linejoin="round" d="M15.75 6a3.75 3.75 0 1 1-7.5 0 3.75 3.75 0 0 1 7.5 0ZM4.501 20.118a7.5 7.5 0 0 1 14.998 0A17.933 17.933 0 0 1 12 21.75c-2.676 0-5.216-.584-7.499-1.632Z"/>
          </svg>
        </div>
      </div>

      <div class="form-group">
        <label class="form-label">密码</label>
        <div class="input-wrapper">
          <input type="password" class="form-input" id="passwordInput" placeholder="请输入密码">
          <svg fill="none" viewBox="0 0 24 24" stroke-width="1.5">
            <path stroke-linecap="round" stroke-linejoin="round" d="M16.5 10.5V6.75a4.5 4.5 0 1 0-9 0v3.75m-.75 11.25h10.5a2.25 2.25 0 0 0 2.25-2.25v-6.75a2.25 2.25 0 0 0-2.25-2.25H6.75a2.25 2.25 0 0 0-2.25 2.25v6.75a2.25 2.25 0 0 0 2.25 2.25Z"/>
          </svg>
        </div>
      </div>

      <div class="form-options">
        <label class="remember-me">
          <input type="checkbox" checked> 记住密码
        </label>
        <a class="forgot-link" onclick="openForgotModal()">忘记密码？</a>
      </div>

      <button type="submit" class="btn-login">登 录</button>
    </form>
  </div>

  <!-- 忘记密码弹窗 -->
  <div class="modal-overlay" id="forgotModal">
    <div class="modal">
      <div class="modal-header">
        <h2>找回密码</h2>
        <button class="modal-close" onclick="closeForgotModal()">
          <svg fill="none" viewBox="0 0 24 24" stroke-width="2">
            <path stroke-linecap="round" stroke-linejoin="round" d="M6 18 18 6M6 6l12 12"/>
          </svg>
        </button>
      </div>

      <p class="modal-desc">请通过手机验证码验证身份后，设置新密码即可完成找回。</p>

      <div class="section-label">手机验证</div>
      <div class="phone-row">
        <input type="tel" class="form-input" id="phoneInput" placeholder="请输入手机号" maxlength="11" style="padding-left:14px">
      </div>
      <div class="code-row">
        <input type="text" class="form-input" id="codeInput" placeholder="请输入验证码" maxlength="6" style="padding-left:14px">
        <button type="button" class="btn-send-code" id="sendCodeBtn" onclick="sendCode()">获取验证码</button>
      </div>

      <div class="modal-divider"></div>

      <div class="section-label">设置新密码</div>
      <div class="form-group">
        <label class="form-label">新密码</label>
        <input type="password" class="form-input" id="newPwd" placeholder="请输入新密码" style="padding-left:14px">
      </div>
      <div class="form-group">
        <label class="form-label">确认密码</label>
        <input type="password" class="form-input" id="confirmPwd" placeholder="请再次输入新密码" style="padding-left:14px">
      </div>

      <button type="button" class="btn-primary" onclick="resetPassword()" style="margin-top:6px">确认重置</button>
    </div>
  </div>

  <!-- Toast -->
  <div class="toast" id="toast"></div>

  <script>
    // 登录
    async function handleLogin(e) {
      e.preventDefault();
      const username = document.querySelector('input[type="text"]').value;
      const password = document.getElementById('passwordInput').value;
      try {
        const resp = await fetch('/api/auth/login', {
          method: 'POST',
          headers: {'Content-Type': 'application/json'},
          body: JSON.stringify({username, password}),
        });
        const data = await resp.json();
        if (data.ok) { showToast('登录成功，正在跳转...'); setTimeout(() => { window.location.href = '/index.html'; }, 800); }
        else { showToast(data.error || '登录失败'); }
      } catch(e) { showToast('网络错误'); }
      return false;
    }

    // 忘记密码弹窗
    function openForgotModal() {
      document.getElementById('forgotModal').classList.add('active');
    }

    function closeForgotModal() {
      document.getElementById('forgotModal').classList.remove('active');
    }

    // 发送验证码倒计时
    function sendCode() {
      const btn = document.getElementById('sendCodeBtn');
      btn.disabled = true;
      let sec = 60;
      btn.textContent = sec + 's';
      const timer = setInterval(() => {
        sec--;
        btn.textContent = sec + 's';
        if (sec <= 0) {
          clearInterval(timer);
          btn.disabled = false;
          btn.textContent = '获取验证码';
        }
      }, 1000);
      showToast('验证码已发送');
    }

    // 重置密码
    function resetPassword() {
      showToast('密码重置成功，请重新登录');
      setTimeout(() => closeForgotModal(), 1200);
    }

    // Toast
    function showToast(msg) {
      const t = document.getElementById('toast');
      t.textContent = msg;
      t.classList.add('show');
      setTimeout(() => t.classList.remove('show'), 2500);
    }

    // 点击遮罩关闭弹窗
    document.getElementById('forgotModal').addEventListener('click', function(e) {
      if (e.target === this) closeForgotModal();
    });
  </script>
</body>
</html>
