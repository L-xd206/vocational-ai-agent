<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>学习计划</title>
  <style>
    @import url('https://fonts.googleapis.com/css2?family=Noto+Sans+SC:wght@300;400;500;600;700;800&display=swap');
    * { margin:0; padding:0; box-sizing:border-box; }
    :root { --blue:#3B82F6; --ink:#172033; --muted:#7E8DA8; --line:#E3EBF5; --white:#FFFFFF; --shadow:0 14px 34px rgba(29,45,74,.08); }
    body { height:100vh; overflow:hidden; display:flex; flex-direction:column; padding:12px 18px 10px; background:radial-gradient(circle at 8% 8%,rgba(191,219,254,.5),transparent 28%),radial-gradient(circle at 92% 12%,rgba(165,180,252,.45),transparent 26%),#F7FAFC; color:var(--ink); font-family:'Noto Sans SC','Microsoft YaHei',sans-serif; }
    .btn { height:36px; display:inline-flex; align-items:center; justify-content:center; gap:7px; padding:0 15px; border:1px solid #DDE8F4; border-radius:11px; background:var(--white); color:#43516A; font-size:13px; font-weight:700; font-family:inherit; cursor:pointer; transition:.18s ease; box-shadow:0 5px 16px rgba(33,51,84,.05); }
    .btn:hover { transform:translateY(-1px); border-color:#B8C8DF; }
    .btn-primary { border-color:#3B82F6; background:linear-gradient(135deg,#60A5FA,#2563EB); color:#fff; box-shadow:0 10px 22px rgba(37,99,235,.22); }
    .btn-danger { border-color:#ef4444; background:linear-gradient(135deg,#f87171,#ef4444); color:#fff; }

    .top-row { display:flex; align-items:center; gap:14px; flex-wrap:wrap; padding:14px 16px; margin-bottom:12px; border:1px solid var(--line); border-radius:16px; background:rgba(255,255,255,.92); box-shadow:0 10px 26px rgba(29,45,74,.06); }
    .student-avatar { width:44px; height:44px; border-radius:12px; background:linear-gradient(135deg,#93C5FD,#A5B4FC); color:#fff; display:flex; align-items:center; justify-content:center; font-size:18px; font-weight:800; flex-shrink:0; }
    .student-name { font-size:16px; font-weight:800; color:#1F2D44; }
    .student-meta { font-size:12px; color:var(--muted); font-weight:600; }

    .overview { display:flex; gap:20px; margin-left:auto; flex-wrap:wrap; }
    .ov-item { text-align:center; }
    .ov-value { font-size:24px; font-weight:800; color:#2563EB; line-height:1; }
    .ov-label { font-size:11px; color:var(--muted); font-weight:700; margin-top:4px; }

    .toolbar { display:flex; align-items:center; gap:12px; flex-wrap:wrap; padding:10px 12px; margin-bottom:12px; border:1px solid var(--line); border-radius:16px; background:rgba(255,255,255,.92); box-shadow:0 10px 26px rgba(29,45,74,.06); }
    .field { height:34px; padding:0 12px; border:1px solid #DDE8F4; border-radius:11px; background:#FBFDFF; color:#25324A; font-size:13px; font-family:inherit; outline:none; }
    .field.search { flex:1; min-width:180px; max-width:280px; }
    .field:focus { border-color:#93C5FD; background:#fff; box-shadow:0 0 0 3px rgba(59,130,246,.08); }
    .filter-count { font-size:12px; color:var(--muted); font-weight:700; margin-left:auto; }

    .plan-grid { flex:1; min-height:0; overflow-y:auto; display:grid; grid-template-columns:repeat(auto-fill,minmax(300px,1fr)); gap:12px; align-content:start; }
    .plan-card { position:relative; padding:16px; border:1px solid var(--line); border-radius:14px; background:var(--white); box-shadow:var(--shadow); cursor:pointer; transition:.16s ease; }
    .plan-card:hover { transform:translateY(-2px); border-color:#C7D8EE; }
    .plan-delete-btn { position:absolute; top:12px; right:12px; width:28px; height:28px; border:none; border-radius:8px; background:transparent; color:#94a3b8; cursor:pointer; display:flex; align-items:center; justify-content:center; }
    .plan-delete-btn:hover { background:#FEF2F2; color:#EF4444; }
    .plan-name { font-size:15px; font-weight:800; color:#1F2D44; margin-bottom:8px; padding-right:30px; }
    .plan-tags { display:flex; gap:6px; margin-bottom:12px; flex-wrap:wrap; }
    .tag { display:inline-flex; align-items:center; padding:2px 9px; border-radius:7px; font-size:11px; font-weight:800; }
    .tag.semester { background:#EFF6FF; color:#2563EB; }
    .tag.self { background:#F0FDF4; color:#16a34a; }
    .tag.ai { background:#F5F3FF; color:#7c3aed; }
    .tag.doing { background:#FEF3C7; color:#d97706; }
    .tag.done { background:#DCFCE7; color:#16a34a; }
    .tag.todo { background:#F1F5F9; color:#64748b; }
    .progress-track { height:8px; border-radius:4px; background:#EEF3F8; overflow:hidden; margin-bottom:10px; }
    .progress-fill { height:100%; border-radius:4px; background:linear-gradient(90deg,#60A5FA,#2563EB); }
    .progress-fill.done { background:#16a34a; }
    .plan-foot { display:flex; justify-content:space-between; align-items:center; font-size:12px; color:var(--muted); font-weight:600; }
    .empty { padding:50px 0; text-align:center; color:var(--muted); font-size:14px; }

    .modal-mask { position:fixed; inset:0; z-index:100; display:none; align-items:center; justify-content:center; padding:20px; background:rgba(18,28,45,.42); backdrop-filter:blur(5px); } .modal-mask.show { display:flex; }
    .modal { width:520px; max-width:92vw; overflow:hidden; border-radius:18px; background:#fff; box-shadow:0 30px 80px rgba(16,30,54,.24); animation:modalIn .2s ease-out; }
    @keyframes modalIn { from{opacity:0;transform:translateY(12px)scale(.98)} to{opacity:1;transform:translateY(0)scale(1)} }
    .modal-head { display:flex; align-items:center; justify-content:space-between; padding:18px 20px; background:linear-gradient(135deg,#F7FBFF,#EEF6FF); border-bottom:1px solid #E7EEF8; }
    .modal-title { font-size:16px; font-weight:800; color:#1F2D44; }
    .modal-close { width:32px; height:32px; border:none; border-radius:9px; background:#fff; color:#8A98AF; cursor:pointer; font-size:18px; }
    .modal-body { padding:20px; }
    .form-item { margin-bottom:14px; }
    .form-label { display:block; margin-bottom:7px; color:#64748B; font-size:12px; font-weight:800; }
    .form-hint { font-size:11px; color:var(--muted); margin-top:6px; }
    textarea.field { height:auto; padding:10px 12px; resize:vertical; line-height:1.6; width:100%; }
    .modal-foot { display:flex; justify-content:flex-end; gap:10px; padding:16px 20px 20px; border-top:1px solid #EEF3F8; }
    .toast { position:fixed; right:22px; top:22px; z-index:120; padding:12px 18px; border-radius:12px; background:#172033; color:#fff; font-size:13px; font-weight:700; opacity:0; transform:translateY(-12px); transition:.25s ease; pointer-events:none; } .toast.show { opacity:1; transform:translateY(0); }
  </style>
</head>
<body>
  {% csrf_token %}
  <section class="top-row">
    <div class="student-avatar" id="avatar">学</div>
    <div>
      <div class="student-name" id="studentName">加载中...</div>
      <div class="student-meta" id="studentMeta"></div>
    </div>
    <div class="overview">
      <div class="ov-item"><div class="ov-value" id="statCurrent">0</div><div class="ov-label">当前课程</div></div>
      <div class="ov-item"><div class="ov-value" id="statRemain">0</div><div class="ov-label">剩余时长</div></div>
      <div class="ov-item"><div class="ov-value" id="statDone">0</div><div class="ov-label">完成课程</div></div>
      <div class="ov-item"><div class="ov-value" id="statHours">0</div><div class="ov-label">学习时长</div></div>
    </div>
  </section>

  <section class="toolbar">
    <input class="field search" id="searchInput" placeholder="搜索计划名称、分类" oninput="loadPlans()">
    <select class="field" id="filterStatus" onchange="loadPlans()">
      <option value="all">全部状态</option>
      <option value="doing">进行中</option>
      <option value="done">已完成</option>
      <option value="todo">未开始</option>
    </select>
    <span class="filter-count">共 <span id="planCount">0</span> 门课程</span>
    <button class="btn btn-primary" onclick="openAddModal()">新增计划</button>
  </section>

  <section class="plan-grid" id="planGrid"><div class="empty">加载中...</div></section>

  <!-- 新增计划弹窗 -->
  <div class="modal-mask" id="addModal" onclick="closeModal(event,'addModal')">
    <div class="modal" onclick="event.stopPropagation()">
      <div class="modal-head"><div class="modal-title">新增学习计划</div><button class="modal-close" onclick="hideModal('addModal')">×</button></div>
      <div class="modal-body">
        <div class="form-item"><label class="form-label">计划名称</label><input class="field" id="formName" placeholder="请输入计划名称" style="width:100%"></div>
        <div class="form-item"><label class="form-label">总学时</label><input class="field" id="formHours" type="number" min="0" placeholder="如 28" style="width:100%"></div>
        <div class="form-item"><label class="form-label">截止日期</label><input class="field" id="formDeadline" type="date" style="width:100%"></div>
      </div>
      <div class="modal-foot">
        <button class="btn" onclick="hideModal('addModal')">取消</button>
        <button class="btn btn-primary" onclick="savePlan()">保存</button>
      </div>
    </div>
  </div>

  <!-- 删除计划弹窗 -->
  <div class="modal-mask" id="deleteModal" onclick="closeModal(event,'deleteModal')">
    <div class="modal" onclick="event.stopPropagation()">
      <div class="modal-head"><div class="modal-title">删除学习计划</div><button class="modal-close" onclick="hideModal('deleteModal')">×</button></div>
      <div class="modal-body">
        <div class="form-item"><label class="form-label">待删除课程</label><div id="deletePlanName" style="font-size:14px;font-weight:700;color:#1f2d3d;padding:8px 12px;background:#f8fafc;border:1px solid #e2e8f0;border-radius:8px;"></div></div>
        <div class="form-item"><label class="form-label">删除原因 <span style="color:#ef4444">*</span></label><textarea class="field" id="deleteReason" placeholder="请填写删除原因，便于后续记录与追溯"></textarea></div>
        <div class="form-hint">删除后将保留原因记录，不会直接清空痕迹</div>
      </div>
      <div class="modal-foot"><button class="btn" onclick="hideModal('deleteModal')">取消</button><button class="btn btn-danger" onclick="confirmDelete()">确认删除</button></div>
    </div>
  </div>

  <div class="toast" id="toast"></div>

  <script>
    function getCookie(n){if(document.cookie){for(const c of document.cookie.split(';')){const t=c.trim();if(t.startsWith(n+'='))return decodeURIComponent(t.substring(n.length+1))}}return null}
    const csrftoken = getCookie('csrftoken');
    const jsonHeaders = () => { const h={'Content-Type':'application/json'}; if(csrftoken) h['X-CSRFToken']=csrftoken; return h; };

    let plans = [], deletingId = null;

    const statusText = { doing:'进行中', done:'已完成', todo:'未开始' };
    const planTypeCls = { semester:'semester', self:'self', ai:'ai' };
    const statusCls = { doing:'doing', done:'done', todo:'todo' };

    async function loadProfile() {
      try {
        const r = await fetch('/api/learning-profile'); const d = await r.json();
        if (d.ok && d.student) {
          document.getElementById('studentName').textContent = d.student.name;
          document.getElementById('avatar').textContent = d.student.name.charAt(0) || '学';
          const meta = [d.student.major, d.student.grade, d.student.class_name, '学号 ' + d.student.student_id].filter(Boolean).join(' · ');
          document.getElementById('studentMeta').textContent = meta;
        }
      } catch(e) { console.error(e); }
    }

    async function loadPlans() {
      const p = {};
      const status = document.getElementById('filterStatus').value;
      if (status && status !== 'all') p.status = status;
      const kw = document.getElementById('searchInput').value.trim();
      if (kw) p.keyword = kw;
      const qs = Object.entries(p).map(([k,v])=>k+'='+encodeURIComponent(v)).join('&');
      try {
        const r = await fetch('/api/learning-plans' + (qs?'?'+qs:'')); const d = await r.json();
        if (d.ok) { plans = d.plans; renderOverview(d.overview); renderPlans(); }
      } catch(e) { console.error(e); }
    }

    function renderOverview(o) {
      document.getElementById('statCurrent').textContent = o.current;
      document.getElementById('statRemain').textContent = o.remain_hours;
      document.getElementById('statDone').textContent = o.done;
      document.getElementById('statHours').textContent = o.learned_hours;
    }

    function renderPlans() {
      document.getElementById('planCount').textContent = String(plans.length);
      const grid = document.getElementById('planGrid');
      if (!plans.length) { grid.innerHTML = '<div class="empty">暂无符合条件的学习计划</div>'; return; }
      grid.innerHTML = plans.map(p => {
        const delBtn = p.can_delete ? `<button class="plan-delete-btn" title="删除计划" onclick="event.stopPropagation(); openDeleteModal(${p.id})">✕</button>` : '';
        return `<article class="plan-card">
          ${delBtn}
          <div class="plan-name">${escapeHtml(p.name)}</div>
          <div class="plan-tags">
            <span class="tag ${planTypeCls[p.plan_type]||''}">${escapeHtml(p.plan_type_display)}</span>
            <span class="tag ${statusCls[p.status]||''}">${statusText[p.status]||p.status}</span>
          </div>
          <div class="progress-track"><div class="progress-fill ${p.status==='done'?'done':''}" style="width:${p.progress}%"></div></div>
          <div class="plan-foot">
            <span>已学 <b>${p.learned_hours}</b> / ${p.total_hours} 学时</span>
            ${p.deadline ? `<span>截止 ${escapeHtml(p.deadline)}</span>` : ''}
          </div>
        </article>`;
      }).join('');
    }

    function openAddModal() {
      document.getElementById('formName').value = '';
      document.getElementById('formHours').value = '';
      document.getElementById('formDeadline').value = '';
      document.getElementById('addModal').classList.add('show');
    }

    async function savePlan() {
      const name = document.getElementById('formName').value.trim();
      const hours = document.getElementById('formHours').value;
      const deadline = document.getElementById('formDeadline').value;
      if (!name) return showToast('请填写计划名称');
      try {
        const r = await fetch('/api/learning-plans', { method:'POST', headers:jsonHeaders(), body:JSON.stringify({name, total_hours:Number(hours)||0, deadline: deadline||null}) });
        const d = await r.json();
        if (d.ok) { hideModal('addModal'); loadPlans(); showToast('学习计划已新增'); }
        else showToast(d.error || '新增失败');
      } catch(e) { showToast('网络错误'); }
    }

    function openDeleteModal(id) {
      const p = plans.find(x => x.id === id); if (!p) return;
      deletingId = id;
      document.getElementById('deletePlanName').textContent = p.name;
      document.getElementById('deleteReason').value = '';
      document.getElementById('deleteModal').classList.add('show');
    }

    async function confirmDelete() {
      if (!deletingId) return;
      const reason = document.getElementById('deleteReason').value.trim();
      if (!reason) return showToast('请填写删除原因');
      try {
        const r = await fetch(`/api/learning-plans/${deletingId}`, { method:'DELETE', headers:jsonHeaders(), body:JSON.stringify({reason}) });
        const d = await r.json();
        if (d.ok) { hideModal('deleteModal'); loadPlans(); showToast('已删除，原因已记录'); }
        else showToast(d.error || '删除失败');
      } catch(e) { showToast('网络错误'); }
      deletingId = null;
    }

    function hideModal(id) { document.getElementById(id).classList.remove('show'); }
    function closeModal(e,id) { if(e.target.id===id) hideModal(id); }
    function showToast(msg) { const t=document.getElementById('toast'); t.textContent=msg; t.classList.add('show'); setTimeout(()=>t.classList.remove('show'),2200); }
    function escapeHtml(s) { const d=document.createElement('div'); d.textContent=s==null?'':String(s); return d.innerHTML; }

    loadProfile();
    loadPlans();
  </script>
</body>
</html>
