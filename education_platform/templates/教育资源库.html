<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>教育资源库</title>
  <style>
    *{box-sizing:border-box} body{margin:0;background:#f7faff;color:#20324c;font-family:-apple-system,BlinkMacSystemFont,"Microsoft YaHei",sans-serif}
    .page{padding:22px;min-width:1050px}.stats{display:grid;grid-template-columns:repeat(4,1fr);gap:14px;margin-bottom:16px}.stat{height:105px;padding:20px;border-radius:16px;background:#fff;box-shadow:0 8px 22px rgba(45,75,120,.08);position:relative;overflow:hidden}.stat:after{content:"";position:absolute;width:76px;height:76px;right:-25px;top:-30px;border-radius:50%;background:var(--c);opacity:.14}.stat small{color:#7284a2;font-weight:700}.stat b{display:block;font-size:32px;margin-top:9px}.toolbar{display:flex;justify-content:space-between;align-items:center;margin:8px 0 16px;padding:12px 14px;background:#fff;border-radius:15px;box-shadow:0 6px 18px rgba(45,75,120,.06)}.toolbar h1{font-size:19px;margin:0}.toolbar p{font-size:13px;color:#8291aa;margin:5px 0 0}.toolbar-actions{display:flex;align-items:center;gap:8px}.hint{font-size:12px;color:#7284a2}.board{min-height:630px;max-height:72vh;background:#f3f7fd;border:1px solid #e1eaf6;border-radius:16px;overflow:auto;box-shadow:0 10px 26px rgba(45,75,120,.08)}.tree-canvas{position:relative;display:grid;grid-template-columns:1fr 1.05fr 1.1fr;min-width:1100px;min-height:630px}.column{position:relative;z-index:2;display:flex;flex-direction:column;padding:16px;border-right:1px solid #dfe8f4}.column:last-child{border:0}.column-head{display:flex;align-items:center;gap:9px;margin-bottom:14px;color:#637492;font-weight:800}.column>div:last-child{flex:1}.course-column>div:last-child,.chapter-column>div:last-child{display:flex;flex-direction:column;justify-content:center}.search{width:100%;height:32px;border:1px solid #d7e3f1;border-radius:9px;padding:0 10px;background:#fff;outline:0}.links{position:absolute;z-index:1;inset:0;width:100%;height:100%;pointer-events:none}.card{position:relative;background:#fff;border-radius:13px;margin-bottom:14px;padding:13px 14px;box-shadow:0 7px 17px rgba(46,76,118,.07);border-left:5px solid var(--accent)}.card.changed{box-shadow:0 0 0 2px rgba(236,112,31,.28),0 9px 22px rgba(180,91,25,.13)}.course{--accent:#3984f7}.chapter{--accent:#22c66a;background:linear-gradient(90deg,#effcf4,#fff 48%)}.point{--accent:#f4a11b;background:linear-gradient(90deg,#fff8ec,#fff 48%)}.node-toggle{position:absolute;top:11px;right:12px;width:25px;height:25px;border:1px solid #d5e2f0;border-radius:7px;background:#fff;color:#64748b;font-size:17px;line-height:20px;cursor:pointer}.name{font-size:15px;font-weight:800;line-height:1.45;padding-right:30px}.meta{font-size:12px;color:#8a99b0;margin-top:4px}.gray{font-size:12px;color:#a3adbd;margin-top:4px}.actions{display:flex;gap:7px;margin-top:10px}.btn{border:1px solid #d8e5f4;background:#fff;border-radius:8px;padding:5px 9px;color:#64748b;font-size:12px;font-weight:700;cursor:pointer}.btn.ai{color:#fff;border-color:#159df0;background:linear-gradient(135deg,#17baf5,#1688e9)}.badge{display:inline-block;padding:2px 7px;border-radius:9px;font-size:11px;font-weight:700;margin-top:7px;background:#edf3fa;color:#8997ad}.badge.done{background:#ecfbf3;color:#159a68}.badge.changed{background:#fff0e4;color:#d96513;border:1px solid #ffd3b2}.empty{padding:30px 14px;text-align:center;color:#96a5bc;font-size:13px}.loading{padding:40px;text-align:center;color:#7284a2}.toast{position:fixed;right:24px;bottom:24px;background:#1d3557;color:#fff;padding:12px 16px;border-radius:10px;display:none;z-index:9;box-shadow:0 8px 20px rgba(0,0,0,.18)}#taskModal textarea{resize:none!important;overflow-y:auto!important;overflow-x:hidden!important}
  </style>
</head>
<body>
  <main class="page">
    <section class="stats">
      <div class="stat" style="--c:#3984f7"><small>课程总数</small><b id="courseCount">0</b></div>
      <div class="stat" style="--c:#21c66a"><small>学习任务数</small><b id="chapterCount">0</b></div>
      <div class="stat" style="--c:#14bddc"><small>任务卡数</small><b id="knowledgeCount">0</b></div>
      <div class="stat" style="--c:#f4ab25"><small>试题数</small><b id="questionCount">0</b></div>
    </section>
    <section class="toolbar">
      <div><h1>教育资源库</h1><p>AI 自动完成岗位能力、教材知识点与学习任务的匹配</p></div>
      <div class="toolbar-actions"><span class="hint">点击未生成课程的“AI 岗课转化”即可自动检索学院教材库</span><button class="btn" onclick="setTreeExpanded(false)">全部收起</button><button class="btn" onclick="setTreeExpanded(true)">全部展开</button></div>
    </section>
    <section class="board" id="treeBoard"><div class="tree-canvas" id="treeCanvas"><svg id="links" class="links"></svg>
      <div class="column course-column"><div class="column-head">课程 <input class="search" placeholder="搜索课程" oninput="filterCards('courseList',this.value)"></div><div id="courseList" class="loading">正在加载课程树…</div></div>
      <div class="column chapter-column"><div class="column-head">学习任务 <input class="search" placeholder="搜索学习任务" oninput="filterCards('chapterList',this.value)"></div><div id="chapterList" class="empty">请选择左侧课程</div></div>
      <div class="column"><div class="column-head">学习任务卡 <input class="search" placeholder="搜索任务卡" oninput="filterCards('pointList',this.value)"></div><div id="pointList" class="empty">请选择中间学习任务</div></div>
    </div></section>
  </main><div id="taskModal" style="display:none;position:fixed;inset:0;z-index:20;background:rgba(23,38,61,.42);padding:5vh 18vw;overflow:auto"><section style="background:#fff;border-radius:16px;padding:20px;box-shadow:0 18px 50px rgba(0,0,0,.18)"><div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:14px"><h2 style="margin:0;font-size:19px">学习任务卡</h2><button class="btn" onclick="closeDetail()">关闭</button></div><label>任务卡名称<input id="detailName" class="search" style="margin:6px 0 12px"></label><label>教材知识点<input id="detailTextbook" class="search" readonly style="margin:6px 0 12px;background:#f5f7fb"></label><label>任务描述<textarea id="detailDescription" class="search" style="height:74px;padding:8px;margin:6px 0 12px"></textarea></label><label>工作情境<textarea id="detailScenario" class="search" style="height:64px;padding:8px;margin:6px 0 12px"></textarea></label><label>操作步骤（每行一步）<textarea id="detailSteps" class="search" style="height:90px;padding:8px;margin:6px 0 12px"></textarea></label><label>安全要点（每行一条）<textarea id="detailSafety" class="search" style="height:70px;padding:8px;margin:6px 0 12px"></textarea></label><div style="margin:4px 0 16px"><b style="font-size:13px">教学资源</b><div id="resourceList" style="margin-top:8px"></div><button class="btn" style="margin-top:6px;color:#159a68;border-color:#bdebd6" onclick="addResource()">＋ 添加资源</button></div><button class="btn ai" onclick="saveDetail()">保存并标记编辑完成</button></section></div><div id="questionModal" style="display:none;position:fixed;inset:0;z-index:21;background:rgba(23,38,61,.48);padding:7vh 25vw;overflow:auto"><section style="background:#fff;border-radius:16px;min-height:520px;box-shadow:0 18px 50px rgba(0,0,0,.2);display:flex;flex-direction:column"><div style="padding:18px 20px;border-bottom:1px solid #edf1f7;display:flex;justify-content:space-between"><b id="questionTitle">试题列表</b><button class="btn" onclick="closeQuestions()">关闭</button></div><div id="questionBody" style="padding:18px 30px;overflow:auto;max-height:63vh"></div><div style="padding:14px 20px;border-top:1px solid #edf1f7;text-align:right"><button class="btn" onclick="closeQuestions()">取消</button><button id="questionEditBtn" class="btn ai" onclick="startQuestionEdit()">编辑试题</button></div></section></div><div id="toast" class="toast"></div>
  <script>
    let courses=[],collapsedNodes=new Set(); const $=id=>document.getElementById(id);
    function esc(s){const d=document.createElement('div');d.textContent=s||'';return d.innerHTML}
    let activeCardId=null,activeNodeType='knowledge',activeResources=[],questionNodeId=null,questionItems=[];function toast(msg){const t=$('toast');t.textContent=msg;t.style.display='block';setTimeout(()=>t.style.display='none',3500)}
    const toLines=v=>(v||[]).join('\n'),fromLines=v=>v.split('\n').map(x=>x.trim()).filter(Boolean);
    function renderResources(){$('resourceList').innerHTML=activeResources.length?activeResources.map((r,i)=>`<div style="display:grid;grid-template-columns:1.1fr .8fr 1.6fr auto;gap:6px;margin-bottom:6px"><input id="rn${i}" class="search" value="${esc(r.name||'')}" placeholder="资源名称"><select id="rt${i}" class="search"><option value="micro_course" ${r.resource_type==='micro_course'?'selected':''}>微课</option><option value="simulation" ${r.resource_type==='simulation'?'selected':''}>仿真</option><option value="video" ${r.resource_type==='video'?'selected':''}>视频</option><option value="courseware" ${r.resource_type==='courseware'?'selected':''}>课件</option><option value="document" ${r.resource_type==='document'?'selected':''}>文档</option><option value="link" ${r.resource_type==='link'?'selected':''}>链接</option></select><input id="ru${i}" class="search" value="${esc(r.url||'')}" placeholder="https://..."><button class="btn" style="color:#e25c68" onclick="removeResource(${i})">删除</button></div>`).join(''):'<div class="gray">暂未关联教学资源</div>'}
    function addResource(){activeResources.push({name:'',resource_type:'micro_course',url:''});renderResources()}
    function removeResource(index){activeResources.splice(index,1);renderResources()}
    function readResources(){return activeResources.map((_,i)=>({name:$(`rn${i}`).value.trim(),resource_type:$(`rt${i}`).value,url:$(`ru${i}`).value.trim()}))}
    async function openDetail(id){try{const r=await fetch(`/api/curriculum/nodes/${id}`),d=await r.json();if(!r.ok)throw new Error(d.error||'读取失败');activeCardId=id;activeNodeType=d.node_type||'knowledge';const isChapter=activeNodeType==='chapter',modal=$('taskModal');modal.querySelector('h2').textContent=isChapter?'编辑学习任务':'编辑学习任务卡';const labels=modal.querySelectorAll('label');labels[0].childNodes[0].textContent=isChapter?'学习任务名称':'任务卡名称';labels[1].childNodes[0].textContent=isChapter?'教材章节':'教材知识点';activeResources=d.resource_links||[];$('detailName').value=d.name;$('detailTextbook').value=d.textbook_node;$('detailDescription').value=d.task_description;$('detailScenario').value=d.work_scenario;$('detailSteps').value=toLines(d.operation_steps);$('detailSafety').value=toLines(d.safety_points);renderResources();modal.style.display='block'}catch(e){toast(e.message)}}
    function closeDetail(){$('taskModal').style.display='none';activeCardId=null}
    async function saveDetail(){if(!activeCardId)return;try{const body={name:$('detailName').value,task_description:$('detailDescription').value,work_scenario:$('detailScenario').value,operation_steps:fromLines($('detailSteps').value),safety_points:fromLines($('detailSafety').value),resource_links:readResources(),is_edited:true};const r=await fetch(`/api/curriculum/nodes/${activeCardId}`,{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify(body)}),d=await r.json();if(!r.ok)throw new Error(d.error||'保存失败');toast(activeNodeType==='chapter'?'学习任务已保存并标记完成':'学习任务卡已保存并标记完成');closeDetail();load()}catch(e){toast(e.message)}}
    async function publishCourse(id){if(!confirm('确认发布课程？'))return;try{const r=await fetch(`/api/curriculum/${id}/publish`,{method:'POST'}),d=await r.json();if(!r.ok)throw new Error(d.issues?.length?`${d.error}：${d.issues.join('；')}`:(d.error||'发布失败'));toast('课程已发布');load()}catch(e){toast(e.message)}}
    const qTypeName={single:'单选题',multiple:'多选题',judgment:'判断题',short:'主观题'};
    async function openQuestions(id){try{const r=await fetch(`/api/teaching/nodes/${id}/questions`),d=await r.json();if(!r.ok)throw new Error(d.error||'读取失败');questionNodeId=id;questionItems=d.questions;$('questionTitle').textContent=`${d.node_name} · 试题列表`;renderQuestionList();$('questionModal').style.display='block'}catch(e){toast(e.message)}}
    function closeQuestions(){$('questionModal').style.display='none';questionNodeId=null;questionItems=[]}
    function renderQuestionList(){const body=$('questionBody');$('questionEditBtn').textContent='编辑试题';$('questionEditBtn').onclick=startQuestionEdit;if(!questionItems.length){body.innerHTML='<div class="empty">暂未添加试题</div>';return}body.innerHTML=questionItems.map((q,i)=>`<article style="border:1px solid #e3ebf4;border-radius:13px;padding:16px;margin-bottom:14px"><span class="badge ${q.question_type==='short'?'':'done'}">第${i+1}题 · ${qTypeName[q.question_type]}</span><div style="font-weight:800;margin:12px 0 8px">${esc(q.stem)}</div>${q.options?.length?`<div class="gray" style="white-space:pre-line;line-height:1.8">${esc(q.options.join('\n'))}</div>`:''}<div class="gray" style="margin-top:10px">参考答案：${esc(q.correct_answer.join('、')||'主观评分')}</div></article>`).join('')}
    function startQuestionEdit(){if(!questionItems.length)questionItems=[{question_type:'single',stem:'',options:['A. 选项一','B. 选项二','C. 选项三','D. 选项四'],correct_answer:[],analysis:'',difficulty:'medium'}];renderQuestionEditor()}
    function renderQuestionEditor(){const body=$('questionBody');$('questionEditBtn').textContent='保存';$('questionEditBtn').onclick=saveQuestions;body.innerHTML=questionItems.map((q,i)=>{const choice=['single','multiple'].includes(q.question_type),answerHint=q.question_type==='judgment'?'正确或错误':q.question_type==='short'?'参考答案或评分标准':q.question_type==='multiple'?'正确选项（多选以逗号分隔）':'正确选项（如 A）';return `<article style="border:1px solid #e3ebf4;border-radius:13px;padding:16px;margin-bottom:14px"><div style="display:flex;justify-content:space-between;align-items:center"><span class="badge">第${i+1}题</span><span><select id="qt${i}" class="btn" onchange="switchQuestionType(${i},this.value)"><option value="single" ${q.question_type==='single'?'selected':''}>单选题</option><option value="multiple" ${q.question_type==='multiple'?'selected':''}>多选题</option><option value="judgment" ${q.question_type==='judgment'?'selected':''}>判断题</option><option value="short" ${q.question_type==='short'?'selected':''}>主观题</option></select><button class="btn" style="color:#e25c68" onclick="deleteQuestion(${i})">删除</button></span></div><label class="gray">题目内容<textarea id="qs${i}" class="search" style="height:70px;padding:8px;margin:6px 0 10px">${esc(q.stem)}</textarea></label><label id="qoptwrap${i}" class="gray" style="display:${choice?'block':'none'}">选项（每行一项，例如：A. 选项内容）<textarea id="qo${i}" class="search" style="height:88px;padding:8px;margin:6px 0 10px">${esc((q.options||[]).join('\n'))}</textarea></label><label id="qanswerlabel${i}" class="gray">${answerHint}<input id="qa${i}" class="search" style="margin:6px 0 10px" value="${esc((q.correct_answer||[]).join('、'))}"></label><label class="gray">${q.question_type==='short'?'评分标准/解析':'答案解析'}<textarea id="qx${i}" class="search" style="height:62px;padding:8px;margin:6px 0 0">${esc(q.analysis||'')}</textarea></label></article>`}).join('')+`<button class="btn" style="color:#18a66b;border-color:#bfead4" onclick="addQuestion()">＋ 添加试题</button>`}
    function switchQuestionType(index,type){const isChoice=['single','multiple'].includes(type),wrap=$(`qoptwrap${index}`),label=$(`qanswerlabel${index}`);wrap.style.display=isChoice?'block':'none';label.firstChild.textContent=type==='judgment'?'正确或错误':type==='short'?'参考答案或评分标准':type==='multiple'?'正确选项（多选以逗号分隔）':'正确选项（如 A）'}
    function addQuestion(){questionItems.push({question_type:'single',stem:'',options:['A. 选项一','B. 选项二','C. 选项三','D. 选项四'],correct_answer:[],analysis:'',difficulty:'medium'});renderQuestionEditor()}
    function deleteQuestion(i){questionItems.splice(i,1);renderQuestionEditor()}
    async function saveQuestions(){const data=[];for(let i=0;i<questionItems.length;i++){const type=$(`qt${i}`).value;data.push({question_type:type,stem:$(`qs${i}`).value,options:['single','multiple'].includes(type)?fromLines($(`qo${i}`).value):[],correct_answer:$(`qa${i}`).value.split(/[、,，\n]/).map(x=>x.trim()).filter(Boolean),analysis:$(`qx${i}`).value,difficulty:'medium'})}try{const r=await fetch(`/api/teaching/nodes/${questionNodeId}/questions`,{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({questions:data})}),d=await r.json();if(!r.ok)throw new Error(d.error||'保存失败');questionItems=d.questions;renderQuestionList();toast('试题已保存');load()}catch(e){toast(e.message)}}
    function filterCards(id,q){q=q.trim().toLowerCase();[...$(id).querySelectorAll('.card')].forEach(x=>x.style.display=x.innerText.toLowerCase().includes(q)?'block':'none');requestAnimationFrame(drawLinks)}
    function courseStatus(c){if(c.has_unpublished_changes)return '<span class="badge changed">有未发布更新</span>';if(c.ai_generation_status==='processing')return '<span class="badge">AI 正在生成，请稍候</span>';if(c.ai_generation_status==='error')return `<span class="badge">生成失败：${esc(c.ai_generation_error||'请重试')}</span>`;return `<span class="badge ${c.is_generated?'done':''}">${c.is_generated?'已生成任务':'待 AI 转化'}</span>`}
    function renderCourses(){
      const cr=$('courseList'),hr=$('chapterList'),pr=$('pointList');
      if(!courses.length){cr.innerHTML='<div class="empty">暂无已下发课程。请先从正式能力树下发岗位能力。</div>';hr.innerHTML='<div class="empty">暂无学习任务</div>';pr.innerHTML='<div class="empty">暂无学习任务卡</div>';return}
      cr.innerHTML=courses.map(c=>{const key=`course-${c.id}`,open=!collapsedNodes.has(key);return `<article class="card course ${c.has_unpublished_changes?'changed':''}" data-node="${key}"><button class="node-toggle" onclick="toggleNode('${key}')">${open?'−':'+'}</button><div class="name">${esc(c.name)}</div><div class="meta">来源能力：${esc(c.source_ability)}</div><div class="gray">匹配教材：${esc(c.textbook)}</div>${courseStatus(c)}<div class="actions">${c.is_generated?(c.is_published?'<button class="btn" disabled>已发布</button>':`<button class="btn ai" onclick="publishCourse(${c.id})">${c.has_unpublished_changes?'重新发布':'发布课程'}</button>`):c.ai_generation_status==='processing'?'<button class="btn" disabled>生成中…</button>':`<button class="btn ai" onclick="event.stopPropagation();generate(${c.id})">${c.ai_generation_status==='error'?'重新生成':'AI 岗课转化'}</button>`}</div></article>`}).join('');
      const chapters=courses.flatMap(c=>collapsedNodes.has(`course-${c.id}`)?[]:c.chapters.map(x=>({...x,courseId:c.id})));
      const points=chapters.flatMap(x=>collapsedNodes.has(`chapter-${x.id}`)?[]:x.points.map(p=>({...p,chapterId:x.id})));
      hr.innerHTML=chapters.length?chapters.map(x=>{const key=`chapter-${x.id}`,open=!collapsedNodes.has(key);return `<article class="card chapter ${x.changed_since_publish?'changed':''}" data-node="${key}" data-parent="course-${x.courseId}"><button class="node-toggle" onclick="toggleNode('${key}')">${open?'−':'+'}</button><div class="name">${esc(x.name)}</div><div class="gray">教材章节：${esc(x.textbook_node)}</div><span class="badge ${x.content_is_edited?'done':''}">${x.content_is_edited?'学习任务已编辑':'学习任务待编辑'}</span><span class="badge ${x.cards_are_edited?'done':''}">${x.cards_are_edited?'任务卡已完成':x.points.length+' 张任务卡待完成'}</span>${x.changed_since_publish?'<span class="badge changed">包含发布后修改</span>':''}<div class="actions"><button class="btn" onclick="openDetail(${x.id})">编辑学习任务</button></div></article>`}).join(''):'<div class="empty">暂无展开的学习任务</div>';
      pr.innerHTML=points.length?points.map(p=>`<article class="card point ${p.changed_since_publish?'changed':''}" data-node="point-${p.id}" data-parent="chapter-${p.chapterId}"><div class="name">${esc(p.name)}</div><div class="gray">教材知识点：${esc(p.textbook_node)}</div><span class="badge ${p.is_edited?'done':''}">${p.is_edited?'已编辑':'待编辑'} · ${p.question_count?'有 '+p.question_count+' 道试题':'无试题'}</span>${p.changed_since_publish?'<span class="badge changed">发布后已修改</span>':''}<div class="actions"><button class="btn" onclick="openDetail(${p.id})">详情</button><button class="btn" onclick="openQuestions(${p.id})">试题</button></div></article>`).join(''):'<div class="empty">暂无展开的学习任务卡</div>';
      requestAnimationFrame(drawLinks)
    }
    function toggleNode(key){if(collapsedNodes.has(key))collapsedNodes.delete(key);else collapsedNodes.add(key);renderCourses()}
    function setTreeExpanded(expanded){collapsedNodes.clear();if(!expanded)courses.forEach(c=>collapsedNodes.add(`course-${c.id}`));renderCourses()}
    function drawLinks(){const canvas=$('treeCanvas'),svg=$('links');if(!canvas||!svg)return;const b=canvas.getBoundingClientRect();svg.setAttribute('viewBox',`0 0 ${canvas.clientWidth} ${canvas.clientHeight}`);svg.innerHTML='';[...canvas.querySelectorAll('[data-parent]')].forEach(child=>{const parent=canvas.querySelector(`[data-node="${child.dataset.parent}"]`);if(!parent||getComputedStyle(parent).display==='none'||getComputedStyle(child).display==='none')return;const p=parent.getBoundingClientRect(),c=child.getBoundingClientRect(),x1=p.right-b.left,y1=p.top+p.height/2-b.top,x2=c.left-b.left,y2=c.top+c.height/2-b.top,dx=Math.max(36,(x2-x1)*.48),color=child.classList.contains('chapter')?'#22c66a':'#f4a11b';const path=document.createElementNS('http://www.w3.org/2000/svg','path');path.setAttribute('d',`M ${x1} ${y1} C ${x1+dx} ${y1}, ${x2-dx} ${y2}, ${x2} ${y2}`);path.setAttribute('fill','none');path.setAttribute('stroke',color);path.setAttribute('stroke-width','3');path.setAttribute('stroke-linecap','round');svg.appendChild(path)})}
    async function generate(id){if(!confirm('将由 AI 自动检索本学院教材库并生成学习任务，是否继续？'))return;try{const r=await fetch(`/api/curriculum/${id}/ai-generate`,{method:'POST',headers:{'Content-Type':'application/json'},body:'{}'}),d=await r.json();if(!r.ok)throw new Error(d.error||'生成失败');toast('AI 已在后台开始检索教材，完成后页面会自动刷新。');await load()}catch(e){toast(e.message)}}
    async function load(){try{const r=await fetch('/api/curriculum/trees'),d=await r.json();if(!r.ok)throw new Error(d.error||'读取失败');courses=d.courses;for(const [k,id] of Object.entries({course_count:'courseCount',chapter_count:'chapterCount',knowledge_count:'knowledgeCount',question_count:'questionCount'}))$(id).textContent=d.stats[k];renderCourses();if(courses.some(c=>c.ai_generation_status==='processing'))setTimeout(load,3000)}catch(e){$('courseList').innerHTML=`<div class="empty">${esc(e.message)}</div>`}}window.addEventListener('resize',()=>requestAnimationFrame(drawLinks));load();
  </script>
</body>
