[uwsgi]
chdir = /srv/vocational-ai-agent/education_platform
module = config.wsgi:application
home = /srv/vocational-ai-agent/education_platform/.venv

# 仅供本机 Nginx 调用，禁止把 8001 暴露到公司网关或公网。
socket = 127.0.0.1:8001
master = true

# 当前项目使用 SQLite，并通过进程内线程执行 AI 后台任务。
# 单进程避免多进程 SQLite 写竞争；必须显式启用 Python 线程。
processes = 1
threads = 4
enable-threads = true
single-interpreter = true

vacuum = true
die-on-term = true
need-app = true
buffer-size = 65535
harakiri = 360
harakiri-verbose = true
