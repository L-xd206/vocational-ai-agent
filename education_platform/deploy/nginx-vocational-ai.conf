server {
    # 公司端口转换/反向代理的目标端口。
    listen 8000;
    server_name _;
    charset utf-8;

    client_max_body_size 20m;
    access_log /var/log/nginx/vocational-ai-access.log;
    error_log /var/log/nginx/vocational-ai-error.log;

    location /static/ {
        alias /srv/vocational-ai-agent/education_platform/collectedstatic/;
        expires 1h;
        add_header Cache-Control "public";
    }

    location / {
        proxy_pass http://127.0.0.1:8001;
        proxy_http_version 1.1;
        proxy_read_timeout 360s;
        proxy_send_timeout 360s;

        proxy_set_header Host $http_host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        # 若公司外层网关传入 X-Forwarded-Proto，则继续传给 Django。
        proxy_set_header X-Forwarded-Proto $http_x_forwarded_proto;
        proxy_set_header Connection "";
    }
}
