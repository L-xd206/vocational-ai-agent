server {
    # 公司端口转换/反向代理的目标端口。
    listen 8000;
    server_name _;
    charset utf-8;

    client_max_body_size 20m;
    access_log /var/log/nginx/vocational-ai-access.log;
    error_log /var/log/nginx/vocational-ai-error.log;

    location /static/ {
        alias /srv/vocational-ai-agent/education_platform/collectedstatic/;
        expires 1h;
        add_header Cache-Control "public";
    }

    location / {
        include uwsgi_params;
        uwsgi_pass 127.0.0.1:8001;
        uwsgi_read_timeout 360s;
        uwsgi_send_timeout 360s;

        uwsgi_param HTTP_HOST $http_host;
        uwsgi_param HTTP_X_REAL_IP $remote_addr;
        uwsgi_param HTTP_X_FORWARDED_FOR $proxy_add_x_forwarded_for;
        # 若公司外层网关传入 X-Forwarded-Proto，则继续传给 Django。
        uwsgi_param HTTP_X_FORWARDED_PROTO $http_x_forwarded_proto;
    }
}
